<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 02 - Mori's Game Site</title>

  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      margin-bottom: 20px;
    }

    .info {
      font-size: 24px;
      line-height: 1.6;
      margin-bottom: 15px;
    }


    /* ========================================
       名前入力
       ======================================== */

    .player-name {
      margin: 15px 0;
      font-size: 20px;
    }

    .player-name input {
      width: 200px;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #aaaaaa;
      border-radius: 5px;
    }

    .player-name input:disabled {
      background-color: #eeeeee;
    }


    /* ========================================
       ゲーム画面
       ======================================== */

    #gameArea {
      position: relative;

      width: 100%;
      max-width: 700px;
      height: 450px;

      margin: 0 auto;

      border: 3px solid #333333;
      background-color: #f5f5f5;

      overflow: hidden;

      box-sizing: border-box;
    }


    /* ========================================
       プレイヤー
       ======================================== */

    #player {
      position: absolute;

      width: 50px;
      height: 50px;

      left: 325px;
      top: 200px;

      background-color: #3498db;

      border-radius: 8px;
    }


    /* ========================================
       飛んでくる球
       ======================================== */

    .ball {
      position: absolute;

      width: 30px;
      height: 30px;

      background-color: #e74c3c;

      border-radius: 50%;
    }


    /* ========================================
       スタートボタン
       ======================================== */

    #startButton {
      font-size: 22px;

      padding: 12px 30px;

      margin: 10px 0 20px;

      cursor: pointer;
    }

    #startButton:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }


    /* ========================================
       操作ボタン
       ======================================== */

    .controls {
      margin-top: 20px;
    }

    .control-row {
      margin: 5px 0;
    }

    .moveButton {
      width: 80px;
      height: 55px;

      margin: 3px;

      font-size: 26px;

      cursor: pointer;

      touch-action: none;
    }


    /* ========================================
       メッセージ
       ======================================== */

    #message {
      min-height: 35px;

      margin-top: 15px;

      font-size: 24px;
      font-weight: bold;
    }


    /* ========================================
       ランキング
       ======================================== */

    #ranking {
      max-width: 650px;

      margin: 40px auto 0;

      padding-top: 20px;

      border-top: 2px solid #dddddd;
    }

    #ranking h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .ranking-table {
      width: 100%;

      border-collapse: collapse;

      overflow: hidden;

      border-radius: 8px;
    }

    .ranking-table th {
      padding: 12px;

      background-color: #333333;
      color: #ffffff;

      font-size: 18px;
    }

    .ranking-table td {
      padding: 12px;

      border-bottom: 1px solid #dddddd;

      font-size: 18px;
    }

    .ranking-rank {
      width: 20%;
      text-align: center;
    }

    .ranking-name {
      width: 50%;
      text-align: center;
    }

    .ranking-score {
      width: 30%;
      text-align: center;
      font-weight: bold;
    }


    /* 1位 */

    .rank-1 {
      background-color: #ffe98a;
      font-weight: bold;
    }


    /* 2位 */

    .rank-2 {
      background-color: #e5e5e5;
      font-weight: bold;
    }


    /* 3位 */

    .rank-3 {
      background-color: #f4c28b;
      font-weight: bold;
    }


    /* ========================================
       戻るボタン
       ======================================== */

    .back {
      display: inline-block;

      margin-top: 30px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* ========================================
       スマホ
       ======================================== */

    @media (max-width: 600px) {

      main {
        padding: 20px 10px;
      }

      #gameArea {
        height: 400px;
      }

      .info {
        font-size: 20px;
      }

      .player-name input {
        width: 160px;
      }

      .moveButton {
        width: 70px;
        height: 50px;
      }

      .ranking-table th,
      .ranking-table td {
        padding: 10px 5px;
        font-size: 16px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 02</h1>

    <p class="description">
      四方から飛んでくる球を避けよう！
    </p>


    <!-- ========================================
         生存時間・スコア
         ======================================== -->

    <div class="info">

      生存時間：
      <span id="time">0.0</span> 秒

      <br>

      スコア：
      <span id="score">0</span> 点

    </div>


    <!-- ========================================
         名前入力
         ======================================== -->

    <div class="player-name">

      名前：

      <input
        type="text"
        id="playerName"
        maxlength="12"
        placeholder="名前を入力">

    </div>


    <!-- ========================================
         スタート
         ======================================== -->

    <button
      id="startButton"
      onclick="startGame()">

      スタート！

    </button>


    <!-- ========================================
         ゲーム画面
         ======================================== -->

    <div id="gameArea">

      <div id="player"></div>

    </div>


    <!-- ========================================
         操作ボタン
         ======================================== -->

    <div class="controls">

      <div class="control-row">

        <button
          class="moveButton"
          id="upButton">

          ↑

        </button>

      </div>


      <div class="control-row">

        <button
          class="moveButton"
          id="leftButton">

          ←

        </button>


        <button
          class="moveButton"
          id="downButton">

          ↓

        </button>


        <button
          class="moveButton"
          id="rightButton">

          →

        </button>

      </div>

    </div>


    <div id="message"></div>


    <!-- ========================================
         ランキング
         ======================================== -->

    <div id="ranking">

      <h2>🏆 ランキング</h2>

      <table class="ranking-table">

        <thead>

          <tr>

            <th>順位</th>

            <th>名前</th>

            <th>スコア</th>

          </tr>

        </thead>


        <tbody id="rankingBody">

          <tr>

            <td colspan="3">
              読み込み中...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <a
      class="back"
      href="index.html">

      ← ゲーム一覧に戻る

    </a>

  </main>



  <!-- ========================================
       Supabase
       ======================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ========================================
    // Supabase設定
    // ========================================

    const SUPABASE_URL =
      "https://vyvbgeqcnrouwpmjwzph.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_CEACy8FVXvk1IVVh5QtSCA_jiNLwHTT";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ========================================
    // ゲーム基本設定
    // ========================================

    const gameArea =
      document.getElementById("gameArea");


    const player =
      document.getElementById("player");


    let gameRunning = false;

    let playerX = 0;
    let playerY = 0;

    let moveLeft = false;
    let moveRight = false;
    let moveUp = false;
    let moveDown = false;

    let balls = [];

    let startTime = 0;
    let lastBallTime = 0;

    let animationId;

    let currentPlayerName = "";


    // ========================================
    // ゲーム開始
    // ========================================

    function startGame() {

      // 名前を取得

      const playerName =
        document
          .getElementById("playerName")
          .value
          .trim();


      // 名前が空欄なら開始しない

      if (playerName === "") {

        document.getElementById("message").textContent =
          "名前を入力してください！";

        return;

      }


      // 今回のプレイヤー名を保存

      currentPlayerName =
        playerName;


      // 前の球を全部削除

      balls.forEach(function(ballData) {

        ballData.element.remove();

      });


      balls = [];


      // 移動状態リセット

      moveLeft = false;
      moveRight = false;
      moveUp = false;
      moveDown = false;


      gameRunning =
        true;


      document.getElementById("message").textContent =
        "";


      document.getElementById("startButton").disabled =
        true;


      // ゲーム中に名前を変更できないようにする

      document.getElementById("playerName").disabled =
        true;


      document.getElementById("time").textContent =
        "0.0";


      document.getElementById("score").textContent =
        "0";


      // ========================================
      // プレイヤーを中央へ
      // ========================================

      playerX =
        (
          gameArea.clientWidth -
          player.offsetWidth
        ) / 2;


      playerY =
        (
          gameArea.clientHeight -
          player.offsetHeight
        ) / 2;


      player.style.left =
        playerX + "px";


      player.style.top =
        playerY + "px";


      // 開始時間

      startTime =
        performance.now();


      lastBallTime =
        startTime;


      animationId =
        requestAnimationFrame(
          gameLoop
        );

    }


    // ========================================
    // メインゲームループ
    // ========================================

    function gameLoop(currentTime) {

      if (!gameRunning) {

        return;

      }


      // ========================================
      // 生存時間
      // ========================================

      const survivalTime =
        (
          currentTime -
          startTime
        ) / 1000;


      document.getElementById("time").textContent =
        survivalTime.toFixed(1);


      // ========================================
      // スコア
      //
      // 1秒 = 10点
      // ========================================

      const score =
        Math.floor(
          survivalTime * 10
        );


      document.getElementById("score").textContent =
        score;


      // ========================================
      // プレイヤー移動
      // ========================================

      const playerSpeed =
        6;


      if (moveLeft) {

        playerX -=
          playerSpeed;

      }


      if (moveRight) {

        playerX +=
          playerSpeed;

      }


      if (moveUp) {

        playerY -=
          playerSpeed;

      }


      if (moveDown) {

        playerY +=
          playerSpeed;

      }


      // ========================================
      // 画面外へ出ないようにする
      // ========================================

      const maxPlayerX =
        gameArea.clientWidth -
        player.offsetWidth;


      const maxPlayerY =
        gameArea.clientHeight -
        player.offsetHeight;


      if (playerX < 0) {

        playerX =
          0;

      }


      if (playerX > maxPlayerX) {

        playerX =
          maxPlayerX;

      }


      if (playerY < 0) {

        playerY =
          0;

      }


      if (playerY > maxPlayerY) {

        playerY =
          maxPlayerY;

      }


      player.style.left =
        playerX + "px";


      player.style.top =
        playerY + "px";


      // ========================================
      // 球を作る
      // ========================================

      const ballInterval =
        Math.max(
          250,
          850 -
          survivalTime * 15
        );


      if (
        currentTime -
        lastBallTime >
        ballInterval
      ) {

        createBall(
          survivalTime
        );


        lastBallTime =
          currentTime;

      }


      // ========================================
      // 球を動かす
      // ========================================

      for (
        let i =
          balls.length - 1;

        i >= 0;

        i--
      ) {

        const ballData =
          balls[i];


        ballData.x +=
          ballData.vx;


        ballData.y +=
          ballData.vy;


        ballData.element.style.left =
          ballData.x + "px";


        ballData.element.style.top =
          ballData.y + "px";


        // ========================================
        // 当たり判定
        // ========================================

        if (
          checkCollision(
            player,
            ballData.element
          )
        ) {

          endGame(
            survivalTime
          );

          return;

        }


        // ========================================
        // 画面外へ出た球を削除
        // ========================================

        if (
          ballData.x < -60 ||

          ballData.x >
            gameArea.clientWidth + 60 ||

          ballData.y < -60 ||

          ballData.y >
            gameArea.clientHeight + 60
        ) {

          ballData.element.remove();


          balls.splice(
            i,
            1
          );

        }

      }


      animationId =
        requestAnimationFrame(
          gameLoop
        );

    }


    // ========================================
    // 球を作る
    //
    // 四方から出現して
    // 出現時のプレイヤー位置を狙う
    // ========================================

    function createBall(survivalTime) {

      const ball =
        document.createElement("div");


      ball.classList.add(
        "ball"
      );


      gameArea.appendChild(
        ball
      );


      const ballSize =
        30;


      const width =
        gameArea.clientWidth;


      const height =
        gameArea.clientHeight;


      // ========================================
      // 0 = 上
      // 1 = 右
      // 2 = 下
      // 3 = 左
      // ========================================

      const side =
        Math.floor(
          Math.random() * 4
        );


      let x;
      let y;


      // 上

      if (side === 0) {

        x =
          Math.random() *
          (
            width -
            ballSize
          );


        y =
          -ballSize;

      }


      // 右

      if (side === 1) {

        x =
          width;


        y =
          Math.random() *
          (
            height -
            ballSize
          );

      }


      // 下

      if (side === 2) {

        x =
          Math.random() *
          (
            width -
            ballSize
          );


        y =
          height;

      }


      // 左

      if (side === 3) {

        x =
          -ballSize;


        y =
          Math.random() *
          (
            height -
            ballSize
          );

      }


      // ========================================
      // プレイヤーの中心
      // ========================================

      const playerCenterX =
        playerX +
        player.offsetWidth / 2;


      const playerCenterY =
        playerY +
        player.offsetHeight / 2;


      // ========================================
      // 球の中心
      // ========================================

      const ballCenterX =
        x +
        ballSize / 2;


      const ballCenterY =
        y +
        ballSize / 2;


      // ========================================
      // プレイヤー方向
      // ========================================

      const dx =
        playerCenterX -
        ballCenterX;


      const dy =
        playerCenterY -
        ballCenterY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      // ========================================
      // 球の速度
      // ========================================

      const speed =
        3 +
        Math.min(
          survivalTime * 0.06,
          4
        );


      const vx =
        (
          dx /
          distance
        ) * speed;


      const vy =
        (
          dy /
          distance
        ) * speed;


      ball.style.left =
        x + "px";


      ball.style.top =
        y + "px";


      balls.push({

        element: ball,

        x: x,
        y: y,

        vx: vx,
        vy: vy

      });

    }


    // ========================================
    // 当たり判定
    // ========================================

    function checkCollision(
      playerElement,
      ballElement
    ) {

      const playerRect =
        playerElement
          .getBoundingClientRect();


      const ballRect =
        ballElement
          .getBoundingClientRect();


      return !(
        playerRect.right <
          ballRect.left ||

        playerRect.left >
          ballRect.right ||

        playerRect.bottom <
          ballRect.top ||

        playerRect.top >
          ballRect.bottom
      );

    }


    // ========================================
    // ゲーム終了
    // ========================================

    function endGame(
      survivalTime
    ) {

      gameRunning =
        false;


      cancelAnimationFrame(
        animationId
      );


      moveLeft = false;
      moveRight = false;
      moveUp = false;
      moveDown = false;


      document.getElementById("startButton").disabled =
        false;


      document.getElementById("playerName").disabled =
        false;


      const finalScore =
        Math.floor(
          survivalTime * 10
        );


      document.getElementById("time").textContent =
        survivalTime.toFixed(1);


      document.getElementById("score").textContent =
        finalScore;


      document.getElementById("message").textContent =
        "ゲームオーバー！ スコアは " +
        finalScore +
        " 点でした！";


      // ========================================
      // Supabaseへスコア保存
      // ========================================

      saveScore(
        finalScore
      );

    }


    // ========================================
    // スコア保存
    // ========================================

    async function saveScore(
      finalScore
    ) {

      const { error } =
        await supabaseClient
          .from("game02_scores")
          .insert([
            {
              player_name:
                currentPlayerName,

              score:
                finalScore
            }
          ]);


      if (error) {

        console.log(
          "スコア保存エラー:",
          error
        );

        return;

      }


      console.log(
        "Game 02のスコアを保存しました！"
      );


      // 保存後ランキング更新

      loadRanking();

    }


    // ========================================
    // ランキング取得
    // ========================================

    async function loadRanking() {

      const { data, error } =
        await supabaseClient
          .from("game02_scores")
          .select(
            "player_name, score"
          )
          .order(
            "score",
            {
              ascending: false
            }
          )
          .limit(
            10
          );


      if (error) {

        console.log(
          "ランキング取得エラー:",
          error
        );

        return;

      }


      const rankingBody =
        document.getElementById(
          "rankingBody"
        );


      rankingBody.innerHTML =
        "";


      // データがまだない場合

      if (data.length === 0) {

        const row =
          document.createElement(
            "tr"
          );


        const cell =
          document.createElement(
            "td"
          );


        cell.colSpan =
          3;


        cell.textContent =
          "まだスコアがありません。";


        row.appendChild(
          cell
        );


        rankingBody.appendChild(
          row
        );


        return;

      }


      // ========================================
      // ランキングを作る
      // ========================================

      data.forEach(
        function(item, index) {

          const rank =
            index + 1;


          const row =
            document.createElement(
              "tr"
            );


          // 上位3人

          if (rank === 1) {

            row.classList.add(
              "rank-1"
            );

          } else if (rank === 2) {

            row.classList.add(
              "rank-2"
            );

          } else if (rank === 3) {

            row.classList.add(
              "rank-3"
            );

          }


          // ========================================
          // 順位
          // ========================================

          const rankCell =
            document.createElement(
              "td"
            );


          rankCell.classList.add(
            "ranking-rank"
          );


          if (rank === 1) {

            rankCell.textContent =
              "🥇 1";

          } else if (rank === 2) {

            rankCell.textContent =
              "🥈 2";

          } else if (rank === 3) {

            rankCell.textContent =
              "🥉 3";

          } else {

            rankCell.textContent =
              rank;

          }


          // ========================================
          // 名前
          // ========================================

          const nameCell =
            document.createElement(
              "td"
            );


          nameCell.classList.add(
            "ranking-name"
          );


          nameCell.textContent =
            item.player_name;


          // ========================================
          // スコア
          // ========================================

          const scoreCell =
            document.createElement(
              "td"
            );


          scoreCell.classList.add(
            "ranking-score"
          );


          scoreCell.textContent =
            item.score +
            "点";


          // ========================================
          // 行を完成させる
          // ========================================

          row.appendChild(
            rankCell
          );


          row.appendChild(
            nameCell
          );


          row.appendChild(
            scoreCell
          );


          rankingBody.appendChild(
            row
          );

        }
      );

    }


    // ========================================
    // キーボード操作
    // ========================================

    document.addEventListener(
      "keydown",
      function(event) {

        // ゲーム中は矢印キーによる
        // ページスクロールを防ぐ

        if (
          gameRunning &&
          (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
          )
        ) {

          event.preventDefault();

        }


        // 左

        if (
          event.key === "ArrowLeft" ||
          event.key === "a" ||
          event.key === "A"
        ) {

          moveLeft =
            true;

        }


        // 右

        if (
          event.key === "ArrowRight" ||
          event.key === "d" ||
          event.key === "D"
        ) {

          moveRight =
            true;

        }


        // 上

        if (
          event.key === "ArrowUp" ||
          event.key === "w" ||
          event.key === "W"
        ) {

          moveUp =
            true;

        }


        // 下

        if (
          event.key === "ArrowDown" ||
          event.key === "s" ||
          event.key === "S"
        ) {

          moveDown =
            true;

        }

      }
    );


    // ========================================
    // キーを離したとき
    // ========================================

    document.addEventListener(
      "keyup",
      function(event) {

        if (
          event.key === "ArrowLeft" ||
          event.key === "a" ||
          event.key === "A"
        ) {

          moveLeft =
            false;

        }


        if (
          event.key === "ArrowRight" ||
          event.key === "d" ||
          event.key === "D"
        ) {

          moveRight =
            false;

        }


        if (
          event.key === "ArrowUp" ||
          event.key === "w" ||
          event.key === "W"
        ) {

          moveUp =
            false;

        }


        if (
          event.key === "ArrowDown" ||
          event.key === "s" ||
          event.key === "S"
        ) {

          moveDown =
            false;

        }

      }
    );


    // ========================================
    // スマホ・マウス操作
    // ========================================

    setupMoveButton(
      "leftButton",
      function(value) {

        moveLeft =
          value;

      }
    );


    setupMoveButton(
      "rightButton",
      function(value) {

        moveRight =
          value;

      }
    );


    setupMoveButton(
      "upButton",
      function(value) {

        moveUp =
          value;

      }
    );


    setupMoveButton(
      "downButton",
      function(value) {

        moveDown =
          value;

      }
    );


    // ========================================
    // 操作ボタン共通処理
    // ========================================

    function setupMoveButton(
      buttonId,
      setMovement
    ) {

      const button =
        document.getElementById(
          buttonId
        );


      button.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();


          setMovement(
            true
          );

        }
      );


      button.addEventListener(
        "pointerup",
        function() {

          setMovement(
            false
          );

        }
      );


      button.addEventListener(
        "pointerleave",
        function() {

          setMovement(
            false
          );

        }
      );


      button.addEventListener(
        "pointercancel",
        function() {

          setMovement(
            false
          );

        }
      );

    }


    // ========================================
    // ページを開いたときランキング取得
    // ========================================

    loadRanking();

  </script>
