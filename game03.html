<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    /* ==============================
       スコア
       ============================== */

    #scoreDisplay {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* ==============================
       ゲームエリア
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 20px;

      background-color: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }

    #gameContainer canvas {
      position: absolute;
      top: 0;
      left: 0;

      z-index: 1;
    }

    /* ==============================
       落下したフルーツ
       ============================== */

    .physics-fruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 3;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      transform-origin: center center;
    }

    /* ==============================
       次に落とすフルーツ
       ============================== */

    #currentFruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
    }

    /* ==============================
       ガイド
       ============================== */

    #guide {
      position: absolute;

      top: 60px;

      width: 2px;
      height: 100px;

      background-color: #bbbbbb;

      z-index: 5;

      transform: translateX(-50%);

      pointer-events: none;
    }

    /* ==============================
       操作ボタン
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .control-button {
      font-size: 22px;

      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background-color: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .move-button {
      font-size: 30px;

      width: 75px;
      height: 55px;

      padding: 0;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #message {
      min-height: 30px;

      margin-top: 15px;

      font-size: 20px;
    }

    /* ==============================
       戻る
       ============================== */

    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }

    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      .control-button {
        font-size: 20px;
      }

      .move-button {
        width: 70px;
        height: 55px;
        font-size: 28px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      同じフルーツをぶつけて合体させよう！<br>
      🍒 → 🍓 → 🍊 → 🍎 → 🍉
    </p>


    <!-- ==============================
         スコア
         ============================== -->

    <div id="scoreDisplay">
      SCORE：0
    </div>


    <!-- ==============================
         ゲーム画面
         ============================== -->

    <div id="gameContainer">

      <div id="guide"></div>

      <div id="currentFruit">
        🍒
      </div>

    </div>


    <!-- ==============================
         操作
         ============================== -->

    <div class="controls">

      <button
        id="leftButton"
        class="control-button move-button">
        ←
      </button>


      <button
        id="dropButton"
        class="control-button">
        落とす！
      </button>


      <button
        id="rightButton"
        class="control-button move-button">
        →
      </button>

    </div>


    <div id="message">
      左右は長押しできます！
    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>



  <!-- ==============================
       Matter.js
       ============================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js">
  </script>


  <script>

    // ========================================
    // Matter.js
    // ========================================

    const Engine =
      Matter.Engine;

    const Render =
      Matter.Render;

    const Runner =
      Matter.Runner;

    const Bodies =
      Matter.Bodies;

    const Composite =
      Matter.Composite;

    const Events =
      Matter.Events;


    // ========================================
    // HTML
    // ========================================

    const gameContainer =
      document.getElementById(
        "gameContainer"
      );

    const currentFruit =
      document.getElementById(
        "currentFruit"
      );

    const guide =
      document.getElementById(
        "guide"
      );

    const dropButton =
      document.getElementById(
        "dropButton"
      );

    const leftButton =
      document.getElementById(
        "leftButton"
      );

    const rightButton =
      document.getElementById(
        "rightButton"
      );

    const scoreDisplay =
      document.getElementById(
        "scoreDisplay"
      );


    // ========================================
    // フルーツ設定
    // ========================================

    const fruits = [

      {
        emoji: "🍒",
        radius: 22,
        color: "#ffd6dc"
      },

      {
        emoji: "🍓",
        radius: 28,
        color: "#ffb6c1"
      },

      {
        emoji: "🍊",
        radius: 35,
        color: "#ffd59a"
      },

      {
        emoji: "🍎",
        radius: 43,
        color: "#ffaaaa"
      },

      {
        emoji: "🍉",
        radius: 55,
        color: "#b8e6b8"
      }

    ];


    // ========================================
    // 合体時のスコア
    // ========================================

    const scoreTable = [

      0,    // 🍒
      10,   // 🍓
      30,   // 🍊
      60,   // 🍎
      100   // 🍉

    ];


    let score =
      0;


    function addScore(type) {

      score +=
        scoreTable[type];


      scoreDisplay.textContent =
        "SCORE：" + score;

    }


    // ========================================
    // ゲームサイズ
    // ========================================

    const gameWidth =
      gameContainer.clientWidth;


    const gameHeight =
      gameContainer.clientHeight;


    // ========================================
    // Matter.jsエンジン
    // ========================================

    const engine =
      Engine.create();


    engine.gravity.y =
      1;


    // ========================================
    // Canvas
    // ========================================

    const render =
      Render.create({

        element:
          gameContainer,

        engine:
          engine,

        options: {

          width:
            gameWidth,

          height:
            gameHeight,

          wireframes:
            false,

          background:
            "transparent"

        }

      });


    Render.run(
      render
    );


    // ========================================
    // Runner
    // ========================================

    const runner =
      Runner.create();


    Runner.run(
      runner,
      engine
    );


    // ========================================
    // 壁・床
    // ========================================

    function createWalls() {

      const wallThickness =
        40;


      const floor =
        Bodies.rectangle(

          gameWidth / 2,

          gameHeight + 20,

          gameWidth,

          wallThickness,

          {

            isStatic:
              true,

            render: {
              visible:
                false
            }

          }

        );


      const leftWall =
        Bodies.rectangle(

          -20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {

            isStatic:
              true,

            render: {
              visible:
                false
            }

          }

        );


      const rightWall =
        Bodies.rectangle(

          gameWidth + 20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {

            isStatic:
              true,

            render: {
              visible:
                false
            }

          }

        );


      Composite.add(

        engine.world,

        [
          floor,
          leftWall,
          rightWall
        ]

      );

    }


    createWalls();


    // ========================================
    // 現在のフルーツ
    // ========================================

    let currentFruitType =
      0;


    let fruitX =
      gameWidth / 2;


    let canDrop =
      true;


    // ========================================
    // 左右移動
    // ========================================

    let moveDirection =
      0;


    let lastMoveTime =
      performance.now();


    const moveSpeed =
      180;


    // ========================================
    // 物理フルーツ作成
    // ========================================

    function createPhysicsFruit(
      x,
      y,
      type
    ) {

      const data =
        fruits[type];


      // ========================================
      // 当たり判定の丸
      // ========================================

      const body =
        Bodies.circle(

          x,

          y,

          data.radius,

          {

            restitution:
              0.12,

            friction:
              0.35,

            frictionStatic:
              0.5,

            density:
              0.001,

            render: {

              visible:
                true,

              fillStyle:
                data.color,

              strokeStyle:
                "#555555",

              lineWidth:
                2

            }

          }

        );


      body.fruitType =
        type;


      body.merging =
        false;


      // ========================================
      // 絵文字
      // ========================================

      const element =
        document.createElement(
          "div"
        );


      element.classList.add(
        "physics-fruit"
      );


      element.textContent =
        data.emoji;


      const diameter =
        data.radius * 2;


      element.style.width =
        diameter + "px";


      element.style.height =
        diameter + "px";


      element.style.fontSize =
        (
          diameter *
          0.82
        ) + "px";


      gameContainer.appendChild(
        element
      );


      body.fruitElement =
        element;


      Composite.add(

        engine.world,

        body

      );


      return body;

    }


    // ========================================
    // 絵文字を物理Bodyに同期
    // ========================================

    function updatePhysicsFruitElements() {

      const bodies =
        Composite.allBodies(
          engine.world
        );


      bodies.forEach(
        function(body) {

          if (
            body.fruitType ===
            undefined
          ) {

            return;

          }


          if (
            !body.fruitElement
          ) {

            return;

          }


          const data =
            fruits[
              body.fruitType
            ];


          const element =
            body.fruitElement;


          element.style.left =
            (
              body.position.x -
              data.radius
            ) + "px";


          element.style.top =
            (
              body.position.y -
              data.radius
            ) + "px";


          element.style.transform =
            "rotate(" +
            body.angle +
            "rad)";

        }
      );


      requestAnimationFrame(
        updatePhysicsFruitElements
      );

    }


    updatePhysicsFruitElements();


    // ========================================
    // 上に待機しているフルーツ
    // ========================================

    function updateCurrentFruit() {

      const data =
        fruits[
          currentFruitType
        ];


      const diameter =
        data.radius * 2;


      // 左端

      if (
        fruitX <
        data.radius
      ) {

        fruitX =
          data.radius;

      }


      // 右端

      if (
        fruitX >
        gameWidth -
        data.radius
      ) {

        fruitX =
          gameWidth -
          data.radius;

      }


      currentFruit.textContent =
        data.emoji;


      currentFruit.style.width =
        diameter + "px";


      currentFruit.style.height =
        diameter + "px";


      currentFruit.style.fontSize =
        (
          diameter *
          0.82
        ) + "px";


      currentFruit.style.left =
        (
          fruitX -
          data.radius
        ) + "px";


      currentFruit.style.top =
        "10px";


      guide.style.left =
        fruitX + "px";

    }


    updateCurrentFruit();


    // ========================================
    // スムーズ左右移動
    // ========================================

    function movementLoop(
      currentTime
    ) {

      const delta =
        (
          currentTime -
          lastMoveTime
        ) / 1000;


      lastMoveTime =
        currentTime;


      if (
        canDrop &&
        moveDirection !== 0
      ) {

        fruitX +=
          moveDirection *
          moveSpeed *
          delta;


        updateCurrentFruit();

      }


      requestAnimationFrame(
        movementLoop
      );

    }


    requestAnimationFrame(
      movementLoop
    );


    // ========================================
    // 移動開始
    // ========================================

    function startMove(
      direction
    ) {

      if (!canDrop) {

        return;

      }


      moveDirection =
        direction;

    }


    // ========================================
    // 移動終了
    // ========================================

    function stopMove() {

      moveDirection =
        0;

    }


    // ========================================
    // 左ボタン
    // ========================================

    leftButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(-1);

      }

    );


    // ========================================
    // 右ボタン
    // ========================================

    rightButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(1);

      }

    );


    // ========================================
    // マウス・指を離した
    // ========================================

    window.addEventListener(

      "pointerup",

      stopMove

    );


    window.addEventListener(

      "pointercancel",

      stopMove

    );


    // ========================================
    // 落とすボタン
    // ========================================

    dropButton.addEventListener(

      "click",

      dropFruit

    );


    // ========================================
    // フルーツを落とす
    // ========================================

    function dropFruit() {

      if (!canDrop) {

        return;

      }


      canDrop =
        false;


      moveDirection =
        0;


      dropButton.disabled =
        true;


      currentFruit.style.display =
        "none";


      const data =
        fruits[
          currentFruitType
        ];


      createPhysicsFruit(

        fruitX,

        20 + data.radius,

        currentFruitType

      );


      // ========================================
      // 次のフルーツを準備
      // ========================================

      setTimeout(

        function() {

          // 今は🍒だけ出す

          currentFruitType =
            0;


          fruitX =
            gameWidth / 2;


          canDrop =
            true;


          dropButton.disabled =
            false;


          currentFruit.style.display =
            "flex";


          updateCurrentFruit();

        },

        500

      );

    }


    // ========================================
    // 衝突・合体
    // ========================================

    Events.on(

      engine,

      "collisionStart",

      function(event) {

        event.pairs.forEach(

          function(pair) {

            const bodyA =
              pair.bodyA;


            const bodyB =
              pair.bodyB;


            // ========================================
            // フルーツ以外は無視
            // ========================================

            if (
              bodyA.fruitType === undefined ||
              bodyB.fruitType === undefined
            ) {

              return;

            }


            // ========================================
            // 違う種類は無視
            // ========================================

            if (
              bodyA.fruitType !==
              bodyB.fruitType
            ) {

              return;

            }


            // ========================================
            // 🍉は合体しない
            // ========================================

            if (
              bodyA.fruitType >=
              fruits.length - 1
            ) {

              return;

            }


            // ========================================
            // 合体処理中なら無視
            // ========================================

            if (
              bodyA.merging ||
              bodyB.merging
            ) {

              return;

            }


            bodyA.merging =
              true;


            bodyB.merging =
              true;


            // ========================================
            // 次のフルーツ
            // ========================================

            const newType =
              bodyA.fruitType + 1;


            // ========================================
            // スコア加算
            // ========================================

            addScore(
              newType
            );


            // ========================================
            // 合体する場所
            // ========================================

            const newX =
              (
                bodyA.position.x +
                bodyB.position.x
              ) / 2;


            const newY =
              (
                bodyA.position.y +
                bodyB.position.y
              ) / 2;


            // ========================================
            // 古い絵文字を削除
            // ========================================

            if (
              bodyA.fruitElement
            ) {

              bodyA.fruitElement.remove();

            }


            if (
              bodyB.fruitElement
            ) {

              bodyB.fruitElement.remove();

            }


            // ========================================
            // 古いBodyを削除
            // ========================================

            Composite.remove(

              engine.world,

              bodyA

            );


            Composite.remove(

              engine.world,

              bodyB

            );


            // ========================================
            // 新しいフルーツを作る
            // ========================================

            createPhysicsFruit(

              newX,

              newY,

              newType

            );

          }

        );

      }

    );


    // ========================================
    // PCキーボード
    // ========================================

    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          startMove(-1);

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          startMove(1);

        }


        if (
          (
            event.key ===
            "ArrowDown" ||
            event.key === " "
          ) &&
          !event.repeat
        ) {

          event.preventDefault();

          dropFruit();

        }

      }

    );


    // ========================================
    // キーを離した
    // ========================================

    document.addEventListener(

      "keyup",

      function(event) {

        if (
          event.key ===
          "ArrowLeft" ||
          event.key ===
          "ArrowRight"
        ) {

          stopMove();

        }

      }

    );


    // ========================================
    // 画面からフォーカスが外れた
    // ========================================

    window.addEventListener(

      "blur",

      stopMove

    );

  </script>

</body>

</html>
