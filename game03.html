<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 25px 20px;
    }

    h1 {
      margin: 0 0 10px;
    }

    .description {
      font-size: 17px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    /* ==============================
       スコア・NEXT
       ============================== */

    .game-info {
      width: 360px;
      margin: 0 auto 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #scoreDisplay {
      font-size: 26px;
      font-weight: bold;
    }

    #nextDisplay {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 18px;
      font-weight: bold;
    }

    #nextFruit {
      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #555555;
      border-radius: 50%;

      font-size: 32px;
      background: #ffffff;
    }

    /* ==============================
       ゲーム画面
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 18px;

      background: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }

    #gameContainer canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ==============================
       ゲームオーバーライン
       ============================== */

    #dangerLine {
      position: absolute;

      top: 105px;
      left: 0;

      width: 100%;

      border-top: 3px dashed #e53935;

      z-index: 4;

      pointer-events: none;
    }

    #dangerText {
      position: absolute;

      top: 82px;
      right: 5px;

      color: #e53935;

      font-size: 12px;
      font-weight: bold;

      z-index: 4;

      pointer-events: none;
    }

    /* ==============================
       落下済みフルーツ
       ============================== */

    .physics-fruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 3;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      transform-origin: center center;
    }

    /* ==============================
       操作中のフルーツ
       ============================== */

    #currentFruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
    }

    /* ==============================
       ガイド
       ============================== */

    #guide {
      position: absolute;

      top: 60px;

      width: 2px;
      height: 45px;

      background: #aaaaaa;

      z-index: 5;

      transform: translateX(-50%);

      pointer-events: none;
    }

    /* ==============================
       ゲームオーバー画面
       ============================== */

    #gameOverScreen {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(255, 255, 255, 0.9);

      z-index: 30;

      display: none;

      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #gameOverScreen h2 {
      font-size: 38px;
      margin: 0 0 15px;
      color: #e53935;
    }

    #finalScore {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    #restartButton {
      font-size: 20px;

      padding: 12px 25px;

      border: none;
      border-radius: 8px;

      background: #333333;
      color: #ffffff;

      cursor: pointer;
    }

    /* ==============================
       操作
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;
    }

    .control-button {
      font-size: 22px;

      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .move-button {
      width: 75px;
      height: 55px;

      padding: 0;

      font-size: 30px;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #message {
      min-height: 30px;

      margin-top: 12px;

      font-size: 18px;
    }

    .back {
      display: inline-block;

      margin-top: 20px;

      padding: 10px 20px;

      background: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      .game-info {
        width: 300px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      #scoreDisplay {
        font-size: 22px;
      }

      #nextDisplay {
        font-size: 16px;
      }

      #nextFruit {
        width: 42px;
        height: 42px;
        font-size: 28px;
      }

      .move-button {
        width: 70px;
      }
    }
  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      同じフルーツをぶつけて大きくしよう！<br>
      🍒 → 🍓 → 🍊 → 🍎 → 🍉 → 🍑 → 🍍 → 🥥
    </p>


    <!-- スコア・NEXT -->

    <div class="game-info">

      <div id="scoreDisplay">
        SCORE：0
      </div>

      <div id="nextDisplay">
        NEXT
        <div id="nextFruit">
          🍒
        </div>
      </div>

    </div>


    <!-- ゲーム画面 -->

    <div id="gameContainer">

      <div id="dangerText">
        GAME OVER LINE
      </div>

      <div id="dangerLine"></div>

      <div id="guide"></div>

      <div id="currentFruit">
        🍒
      </div>


      <!-- ゲームオーバー -->

      <div id="gameOverScreen">

        <h2>GAME OVER</h2>

        <div id="finalScore">
          SCORE：0
        </div>

        <button id="restartButton">
          もう一度遊ぶ
        </button>

      </div>

    </div>


    <!-- 操作 -->

    <div class="controls">

      <button
        id="leftButton"
        class="control-button move-button">
        ←
      </button>

      <button
        id="dropButton"
        class="control-button">
        落とす！
      </button>

      <button
        id="rightButton"
        class="control-button move-button">
        →
      </button>

    </div>


    <div id="message">
      左右に動かして落とそう！
    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>


  <!-- Matter.js -->

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js">
  </script>


  <script>

    // ========================================
    // Matter.js
    // ========================================

    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;
    const Events = Matter.Events;


    // ========================================
    // HTML
    // ========================================

    const gameContainer =
      document.getElementById("gameContainer");

    const currentFruit =
      document.getElementById("currentFruit");

    const nextFruit =
      document.getElementById("nextFruit");

    const guide =
      document.getElementById("guide");

    const dropButton =
      document.getElementById("dropButton");

    const leftButton =
      document.getElementById("leftButton");

    const rightButton =
      document.getElementById("rightButton");

    const scoreDisplay =
      document.getElementById("scoreDisplay");

    const gameOverScreen =
      document.getElementById("gameOverScreen");

    const finalScore =
      document.getElementById("finalScore");

    const restartButton =
      document.getElementById("restartButton");


    // ========================================
    // フルーツ
    // ========================================

    const fruits = [

      {
        emoji: "🍒",
        radius: 20,
        color: "#ffd6dc",
        score: 0
      },

      {
        emoji: "🍓",
        radius: 25,
        color: "#ffb6c1",
        score: 10
      },

      {
        emoji: "🍊",
        radius: 31,
        color: "#ffd59a",
        score: 30
      },

      {
        emoji: "🍎",
        radius: 37,
        color: "#ffaaaa",
        score: 60
      },

      {
        emoji: "🍉",
        radius: 44,
        color: "#b8e6b8",
        score: 100
      },

      {
        emoji: "🍑",
        radius: 51,
        color: "#ffd0c2",
        score: 150
      },

      {
        emoji: "🍍",
        radius: 59,
        color: "#ffe48a",
        score: 220
      },

      {
        emoji: "🥥",
        radius: 68,
        color: "#d7c0a5",
        score: 300
      }

    ];


    // ========================================
    // ゲームサイズ
    // ========================================

    const gameWidth =
      gameContainer.clientWidth;

    const gameHeight =
      gameContainer.clientHeight;


    // ========================================
    // ゲーム設定
    // ========================================

    const dangerLineY =
      105;

    let score =
      0;

    let gameOver =
      false;

    let canDrop =
      true;

    let fruitX =
      gameWidth / 2;


    // ========================================
    // ランダムフルーツ
    //
    // 最初から巨大フルーツは出さない
    // 🍒 🍓 🍊 の3種類
    // ========================================

    function randomFruitType() {

      return Math.floor(
        Math.random() * 3
      );

    }


    let currentFruitType =
      randomFruitType();

    let nextFruitType =
      randomFruitType();


    // ========================================
    // Matter.js
    // ========================================

    const engine =
      Engine.create();

    engine.gravity.y =
      1;


    const render =
      Render.create({

        element:
          gameContainer,

        engine:
          engine,

        options: {

          width:
            gameWidth,

          height:
            gameHeight,

          wireframes:
            false,

          background:
            "transparent"

        }

      });


    Render.run(render);


    const runner =
      Runner.create();

    Runner.run(
      runner,
      engine
    );


    // ========================================
    // 壁・床
    // ========================================

    function createWalls() {

      const thickness =
        40;


      const floor =
        Bodies.rectangle(

          gameWidth / 2,

          gameHeight + 20,

          gameWidth,

          thickness,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const leftWall =
        Bodies.rectangle(

          -20,

          gameHeight / 2,

          thickness,

          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const rightWall =
        Bodies.rectangle(

          gameWidth + 20,

          gameHeight / 2,

          thickness,

          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      Composite.add(

        engine.world,

        [
          floor,
          leftWall,
          rightWall
        ]

      );

    }


    createWalls();


    // ========================================
    // スコア
    // ========================================

    function addScore(type) {

      score +=
        fruits[type].score;

      scoreDisplay.textContent =
        "SCORE：" + score;

    }


    // ========================================
    // 物理フルーツ作成
    // ========================================

    function createPhysicsFruit(
      x,
      y,
      type
    ) {

      const data =
        fruits[type];


      const body =
        Bodies.circle(

          x,
          y,
          data.radius,

          {

            restitution:
              0.1,

            friction:
              0.35,

            frictionStatic:
              0.5,

            density:
              0.001,

            render: {

              visible:
                true,

              fillStyle:
                data.color,

              strokeStyle:
                "#555555",

              lineWidth:
                2

            }

          }

        );


      body.fruitType =
        type;

      body.merging =
        false;

      body.dangerStart =
        null;


      // ========================================
      // 絵文字
      // ========================================

      const element =
        document.createElement("div");

      element.classList.add(
        "physics-fruit"
      );

      element.textContent =
        data.emoji;


      const diameter =
        data.radius * 2;


      element.style.width =
        diameter + "px";

      element.style.height =
        diameter + "px";

      element.style.fontSize =
        (
          diameter * 0.8
        ) + "px";


      gameContainer.appendChild(
        element
      );


      body.fruitElement =
        element;


      Composite.add(
        engine.world,
        body
      );


      return body;

    }


    // ========================================
    // HTMLと物理Bodyを同期
    // ========================================

    function updateFruitElements() {

      const bodies =
        Composite.allBodies(
          engine.world
        );


      bodies.forEach(
        function(body) {

          if (
            body.fruitType === undefined ||
            !body.fruitElement
          ) {

            return;

          }


          const data =
            fruits[body.fruitType];


          body.fruitElement.style.left =
            (
              body.position.x -
              data.radius
            ) + "px";


          body.fruitElement.style.top =
            (
              body.position.y -
              data.radius
            ) + "px";


          body.fruitElement.style.transform =
            "rotate(" +
            body.angle +
            "rad)";

        }
      );


      requestAnimationFrame(
        updateFruitElements
      );

    }


    updateFruitElements();


    // ========================================
    // NEXT表示
    // ========================================

    function updateNextDisplay() {

      nextFruit.textContent =
        fruits[nextFruitType].emoji;


      nextFruit.style.backgroundColor =
        fruits[nextFruitType].color;

    }


    // ========================================
    // 現在のフルーツ表示
    // ========================================

    function updateCurrentFruit() {

      const data =
        fruits[currentFruitType];


      const diameter =
        data.radius * 2;


      if (
        fruitX < data.radius
      ) {

        fruitX =
          data.radius;

      }


      if (
        fruitX >
        gameWidth - data.radius
      ) {

        fruitX =
          gameWidth - data.radius;

      }


      currentFruit.textContent =
        data.emoji;


      currentFruit.style.width =
        diameter + "px";


      currentFruit.style.height =
        diameter + "px";


      currentFruit.style.fontSize =
        (
          diameter * 0.8
        ) + "px";


      currentFruit.style.left =
        (
          fruitX -
          data.radius
        ) + "px";


      currentFruit.style.top =
        "10px";


      guide.style.left =
        fruitX + "px";

    }


    updateCurrentFruit();
    updateNextDisplay();


    // ========================================
    // スムーズ左右移動
    // ========================================

    let moveDirection =
      0;

    let lastMoveTime =
      performance.now();

    const moveSpeed =
      180;


    function movementLoop(
      currentTime
    ) {

      const delta =
        (
          currentTime -
          lastMoveTime
        ) / 1000;


      lastMoveTime =
        currentTime;


      if (
        canDrop &&
        !gameOver &&
        moveDirection !== 0
      ) {

        fruitX +=
          moveDirection *
          moveSpeed *
          delta;


        updateCurrentFruit();

      }


      requestAnimationFrame(
        movementLoop
      );

    }


    requestAnimationFrame(
      movementLoop
    );


    function startMove(
      direction
    ) {

      if (
        gameOver ||
        !canDrop
      ) {

        return;

      }


      moveDirection =
        direction;

    }


    function stopMove() {

      moveDirection =
        0;

    }


    // ========================================
    // 落とす
    // ========================================

    function dropFruit() {

      if (
        !canDrop ||
        gameOver
      ) {

        return;

      }


      canDrop =
        false;

      moveDirection =
        0;

      dropButton.disabled =
        true;

      currentFruit.style.display =
        "none";


      const data =
        fruits[currentFruitType];


      createPhysicsFruit(

        fruitX,

        20 + data.radius,

        currentFruitType

      );


      // ========================================
      // NEXTを現在のフルーツへ
      // ========================================

      setTimeout(

        function() {

          if (gameOver) {
            return;
          }


          currentFruitType =
            nextFruitType;


          nextFruitType =
            randomFruitType();


          fruitX =
            gameWidth / 2;


          canDrop =
            true;


          dropButton.disabled =
            false;


          currentFruit.style.display =
            "flex";


          updateCurrentFruit();

          updateNextDisplay();

        },

        500

      );

    }


    // ========================================
    // 合体
    // ========================================

    Events.on(

      engine,

      "collisionStart",

      function(event) {

        if (gameOver) {
          return;
        }


        event.pairs.forEach(

          function(pair) {

            const bodyA =
              pair.bodyA;

            const bodyB =
              pair.bodyB;


            // フルーツ同士か確認

            if (
              bodyA.fruitType === undefined ||
              bodyB.fruitType === undefined
            ) {

              return;

            }


            // 同じ種類か

            if (
              bodyA.fruitType !==
              bodyB.fruitType
            ) {

              return;

            }


            // 最終フルーツは合体しない

            if (
              bodyA.fruitType >=
              fruits.length - 1
            ) {

              return;

            }


            // 二重合体防止

            if (
              bodyA.merging ||
              bodyB.merging
            ) {

              return;

            }


            bodyA.merging =
              true;

            bodyB.merging =
              true;


            const newType =
              bodyA.fruitType + 1;


            const newX =
              (
                bodyA.position.x +
                bodyB.position.x
              ) / 2;


            const newY =
              (
                bodyA.position.y +
                bodyB.position.y
              ) / 2;


            // ========================================
            // スコア
            // ========================================

            addScore(
              newType
            );


            // ========================================
            // 古いHTML削除
            // ========================================

            if (
              bodyA.fruitElement
            ) {

              bodyA.fruitElement.remove();

            }


            if (
              bodyB.fruitElement
            ) {

              bodyB.fruitElement.remove();

            }


            // ========================================
            // 古いBody削除
            // ========================================

            Composite.remove(
              engine.world,
              bodyA
            );


            Composite.remove(
              engine.world,
              bodyB
            );


            // ========================================
            // 新しいフルーツ
            // ========================================

            createPhysicsFruit(

              newX,
              newY,
              newType

            );

          }

        );

      }

    );


    // ========================================
    // ゲームオーバー判定
    // ========================================

    function checkGameOver() {

      if (gameOver) {

        return;

      }


      const bodies =
        Composite.allBodies(
          engine.world
        );


      const now =
        performance.now();


      for (
        const body of bodies
      ) {

        if (
          body.fruitType === undefined
        ) {

          continue;

        }


        const radius =
          fruits[
            body.fruitType
          ].radius;


        // ========================================
        // フルーツ上端がラインより上
        // ========================================

        const fruitTop =
          body.position.y -
          radius;


        // ========================================
        // ほぼ止まっているか
        //
        // 落下途中でゲームオーバーに
        // ならないようにする
        // ========================================

        const almostStopped =
          Math.abs(
            body.velocity.y
          ) < 0.5;


        if (
          fruitTop <
          dangerLineY &&
          almostStopped
        ) {

          if (
            body.dangerStart ===
            null
          ) {

            body.dangerStart =
              now;

          }


          // ========================================
          // 2秒以上ライン超え
          // ========================================

          if (
            now -
            body.dangerStart >
            2000
          ) {

            endGame();

            return;

          }

        } else {

          body.dangerStart =
            null;

        }

      }

    }


    setInterval(

      checkGameOver,

      100

    );


    // ========================================
    // ゲームオーバー
    // ========================================

    function endGame() {

      if (gameOver) {

        return;

      }


      gameOver =
        true;


      canDrop =
        false;


      moveDirection =
        0;


      dropButton.disabled =
        true;

      leftButton.disabled =
        true;

      rightButton.disabled =
        true;


      currentFruit.style.display =
        "none";

      guide.style.display =
        "none";


      finalScore.textContent =
        "SCORE：" + score;


      gameOverScreen.style.display =
        "flex";

    }


    // ========================================
    // リスタート
    // ========================================

    restartButton.addEventListener(

      "click",

      function() {

        location.reload();

      }

    );


    // ========================================
    // ボタン操作
    // ========================================

    leftButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(-1);

      }

    );


    rightButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(1);

      }

    );


    window.addEventListener(

      "pointerup",

      stopMove

    );


    window.addEventListener(

      "pointercancel",

      stopMove

    );


    dropButton.addEventListener(

      "click",

      dropFruit

    );


    // ========================================
    // キーボード
    // ========================================

    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          startMove(-1);

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          startMove(1);

        }


        if (
          (
            event.key ===
            "ArrowDown" ||
            event.key === " "
          ) &&
          !event.repeat
        ) {

          event.preventDefault();

          dropFruit();

        }

      }

    );


    document.addEventListener(

      "keyup",

      function(event) {

        if (
          event.key ===
          "ArrowLeft" ||
          event.key ===
          "ArrowRight"
        ) {

          stopMove();

        }

      }

    );


    window.addEventListener(

      "blur",

      stopMove

    );

  </script>

</body>

</html>
