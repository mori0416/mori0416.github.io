<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .game-area {
      margin: 0 auto 30px;
      padding: 40px 20px;
      border: 2px solid #333333;
      background-color: #f5f5f5;
    }

    .description {
      font-size: 20px;
      margin-bottom: 30px;
    }

    input {
      width: 150px;
      padding: 12px;
      font-size: 20px;
      text-align: center;
    }

    button {
      padding: 12px 25px;
      font-size: 20px;
      cursor: pointer;
      margin-left: 10px;
    }

    #message {
      font-size: 22px;
      margin-top: 30px;
      min-height: 30px;
    }

    #count {
      font-size: 18px;
      margin-top: 20px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }

    @media (max-width: 600px) {

      input {
        width: 100px;
      }

      button {
        margin-left: 0;
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>Game 03</h1>

    <div class="game-area">

      <p class="description">
        1〜100の数字を当ててください！
      </p>

      <input
        type="number"
        id="guess"
        min="1"
        max="100"
        placeholder="数字">

      <button onclick="checkAnswer()">
        決定！
      </button>

      <div id="message"></div>

      <div id="count">
        挑戦回数：0回
      </div>

    </div>

    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>

  <script>

    let answer = Math.floor(Math.random() * 100) + 1;
    let count = 0;

    function checkAnswer() {

      const input = document.getElementById("guess");
      const guess = Number(input.value);

      if (guess < 1 || guess > 100) {

        document.getElementById("message").textContent =
          "1〜100の数字を入力してください。";

        return;
      }

      count = count + 1;

      document.getElementById("count").textContent =
        "挑戦回数：" + count + "回";

      if (guess === answer) {

        document.getElementById("message").textContent =
          "🎉 正解！ " + answer + " でした！";

      } else if (guess < answer) {

        document.getElementById("message").textContent =
          "もっと大きい数字です！";

      } else {

        document.getElementById("message").textContent =
          "もっと小さい数字です！";

      }

      input.value = "";
      input.focus();
    }

  </script>

</body>

</html>
