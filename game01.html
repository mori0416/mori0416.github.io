<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 01 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      margin-bottom: 25px;
      font-size: 18px;
    }

    .game-area {
      max-width: 650px;
      margin: 0 auto 30px;
      padding: 30px 20px;
      border: 2px solid #333333;
      border-radius: 10px;
    }

    .info {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .player-name {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .player-name input {
      width: 200px;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #aaaaaa;
      border-radius: 5px;
    }

    #startButton {
      font-size: 22px;
      padding: 12px 30px;
      cursor: pointer;
      margin: 10px 0 25px;
    }

    #startButton:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }


    /* ==============================
       モグラ叩き
       ============================== */

    #moleGame {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 10px;
    }

    .hole {
      aspect-ratio: 1 / 1;

      border: 3px solid #555555;
      border-radius: 12px;

      background-color: #eeeeee;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 60px;

      cursor: default;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;
    }

    .hole.active {
      background-color: #dff3d8;
      cursor: pointer;
    }

    .mole {
      display: none;
    }

    .hole.active .mole {
      display: block;
    }


    /* ==============================
       メッセージ
       ============================== */

    #message {
      font-size: 22px;
      margin-top: 20px;
      min-height: 30px;
      font-weight: bold;
    }


    /* ==============================
       ランキング
       ============================== */

    #ranking {
      max-width: 650px;
      margin: 40px auto 0;
      padding-top: 20px;
      border-top: 2px solid #dddddd;
    }

    #ranking h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    .ranking-table th {
      background-color: #333333;
      color: #ffffff;
      padding: 12px;
      font-size: 18px;
    }

    .ranking-table td {
      padding: 12px;
      border-bottom: 1px solid #dddddd;
      font-size: 18px;
    }

    .ranking-rank {
      width: 20%;
      text-align: center;
    }

    .ranking-name {
      width: 50%;
      text-align: center;
    }

    .ranking-score {
      width: 30%;
      text-align: center;
      font-weight: bold;
    }

    .rank-1 {
      background-color: #ffe98a;
      font-weight: bold;
      font-size: 20px;
    }

    .rank-2 {
      background-color: #e5e5e5;
      font-weight: bold;
    }

    .rank-3 {
      background-color: #f4c28b;
      font-weight: bold;
    }


    /* ==============================
       戻る
       ============================== */

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 600px) {

      main {
        padding: 20px 10px;
      }

      .game-area {
        padding: 25px 12px;
      }

      .player-name input {
        width: 160px;
      }

      #moleGame {
        max-width: 350px;
        gap: 7px;
      }

      .hole {
        font-size: 45px;
        border-width: 2px;
      }

      .ranking-table th,
      .ranking-table td {
        padding: 10px 5px;
        font-size: 16px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 01</h1>

    <p class="description">
      出てきたモグラを叩こう！
    </p>


    <div class="game-area">

      <div class="info">
        残り時間：<span id="time">10</span>秒
      </div>

      <div class="score">
        スコア：<span id="score">0</span>
      </div>


      <!-- 名前 -->

      <div class="player-name">

        名前：

        <input
          type="text"
          id="playerName"
          maxlength="12"
          placeholder="名前を入力">

      </div>


      <!-- スタート -->

      <button
        id="startButton"
        onclick="startGame()">

        スタート！

      </button>


      <!-- ==============================
           3×3 モグラ叩き
           ============================== -->

      <div id="moleGame">

        <div class="hole" onclick="hitMole(0)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(1)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(2)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(3)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(4)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(5)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(6)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(7)">
          <span class="mole">🐹</span>
        </div>

        <div class="hole" onclick="hitMole(8)">
          <span class="mole">🐹</span>
        </div>

      </div>


      <div id="message"></div>


      <!-- ==============================
           ランキング
           ============================== -->

      <div id="ranking">

        <h2>🏆 ランキング</h2>

        <table class="ranking-table">

          <thead>

            <tr>
              <th>順位</th>
              <th>名前</th>
              <th>スコア</th>
            </tr>

          </thead>

          <tbody id="rankingBody">

            <tr>
              <td colspan="3">
                読み込み中...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>



  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ========================================
    // Supabase
    // ========================================

    const SUPABASE_URL =
      "https://vyvbgeqcnrouwpmjwzph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CEACy8FVXvk1IVVh5QtSCA_jiNLwHTT";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // ========================================
    // ゲーム
    // ========================================

    let score = 0;

    let time = 10;

    let timer;

    let gameRunning = false;

    let activeMole = -1;

    let currentPlayerName = "";


    const holes =
      document.querySelectorAll(
        ".hole"
      );



    // ========================================
    // ゲーム開始
    // ========================================

    function startGame() {

      const playerName =
        document
          .getElementById("playerName")
          .value
          .trim();


      // 名前チェック

      if (playerName === "") {

        document.getElementById("message").textContent =
          "名前を入力してください！";

        return;

      }


      currentPlayerName =
        playerName;


      score = 0;

      time = 10;

      gameRunning = true;


      document.getElementById("score").textContent =
        score;


      document.getElementById("time").textContent =
        time;


      document.getElementById("message").textContent =
        "";


      document.getElementById("startButton").disabled =
        true;


      document.getElementById("playerName").disabled =
        true;


      // 最初のモグラ

      showMole();


      // ========================================
      // タイマー
      // ========================================

      timer =
        setInterval(
          function() {

            time =
              time - 1;


            document.getElementById("time").textContent =
              time;


            if (time <= 0) {

              endGame();

            }

          },
          1000
        );

    }



    // ========================================
    // モグラを出す
    // ========================================

    function showMole() {

      // 今いるモグラを消す

      holes.forEach(
        function(hole) {

          hole.classList.remove(
            "active"
          );

        }
      );


      let newMole;


      // 同じ場所が連続しないようにする

      do {

        newMole =
          Math.floor(
            Math.random() * 9
          );

      } while (
        newMole === activeMole
      );


      activeMole =
        newMole;


      holes[
        activeMole
      ].classList.add(
        "active"
      );

    }



    // ========================================
    // モグラを叩く
    // ========================================

    function hitMole(
      holeNumber
    ) {

      if (!gameRunning) {

        return;

      }


      // モグラがいるマスだけ正解

      if (
        holeNumber !==
        activeMole
      ) {

        return;

      }


      // 1点追加

      score =
        score + 1;


      document.getElementById("score").textContent =
        score;


      // 次のモグラ

      showMole();

    }



    // ========================================
    // ゲーム終了
    // ========================================

    function endGame() {

      if (!gameRunning) {

        return;

      }


      gameRunning =
        false;


      clearInterval(
        timer
      );


      // モグラを消す

      holes.forEach(
        function(hole) {

          hole.classList.remove(
            "active"
          );

        }
      );


      activeMole =
        -1;


      document.getElementById("startButton").disabled =
        false;


      document.getElementById("playerName").disabled =
        false;


      document.getElementById("message").textContent =
        "ゲーム終了！ スコアは " +
        score +
        " 点でした！";


      // Supabaseへ保存

      saveScore();

    }



    // ========================================
    // スコア保存
    // ========================================

    async function saveScore() {

      const { error } =
        await supabaseClient
          .from("game01_scores")
          .insert([
            {
              player_name:
                currentPlayerName,

              score:
                score
            }
          ]);


      if (error) {

        console.log(
          "スコア保存エラー:",
          error
        );

      } else {

        console.log(
          "スコアを保存しました！"
        );


        loadRanking();

      }

    }



    // ========================================
    // ランキング取得
    // ========================================

    async function loadRanking() {

      const { data, error } =
        await supabaseClient
          .from("game01_scores")
          .select(
            "player_name, score"
          )
          .order(
            "score",
            {
              ascending: false
            }
          )
          .limit(
            10
          );


      if (error) {

        console.log(
          "ランキング取得エラー:",
          error
        );

        return;

      }


      const rankingBody =
        document.getElementById(
          "rankingBody"
        );


      rankingBody.innerHTML =
        "";


      // スコアがまだない場合

      if (data.length === 0) {

        const row =
          document.createElement(
            "tr"
          );


        const cell =
          document.createElement(
            "td"
          );


        cell.colSpan =
          3;


        cell.textContent =
          "まだスコアがありません。";


        row.appendChild(
          cell
        );


        rankingBody.appendChild(
          row
        );


        return;

      }



      // ========================================
      // ランキング作成
      // ========================================

      data.forEach(
        function(item, index) {

          const rank =
            index + 1;


          const row =
            document.createElement(
              "tr"
            );


          // 上位3人

          if (rank === 1) {

            row.classList.add(
              "rank-1"
            );

          } else if (rank === 2) {

            row.classList.add(
              "rank-2"
            );

          } else if (rank === 3) {

            row.classList.add(
              "rank-3"
            );

          }



          // 順位

          const rankCell =
            document.createElement(
              "td"
            );


          rankCell.classList.add(
            "ranking-rank"
          );


          if (rank === 1) {

            rankCell.textContent =
              "🥇 1";

          } else if (rank === 2) {

            rankCell.textContent =
              "🥈 2";

          } else if (rank === 3) {

            rankCell.textContent =
              "🥉 3";

          } else {

            rankCell.textContent =
              rank;

          }



          // 名前

          const nameCell =
            document.createElement(
              "td"
            );


          nameCell.classList.add(
            "ranking-name"
          );


          nameCell.textContent =
            item.player_name;



          // スコア

          const scoreCell =
            document.createElement(
              "td"
            );


          scoreCell.classList.add(
            "ranking-score"
          );


          scoreCell.textContent =
            item.score +
            "点";



          row.appendChild(
            rankCell
          );


          row.appendChild(
            nameCell
          );


          row.appendChild(
            scoreCell
          );


          rankingBody.appendChild(
            row
          );

        }
      );

    }



    // ========================================
    // ページを開いたときランキング取得
    // ========================================

    loadRanking();

  </script>


</body>

</html>
