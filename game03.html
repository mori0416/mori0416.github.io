<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 20px;
    }


    /* ==============================
       ゲームエリア
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 20px;

      background-color: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }


    /* ==============================
       落とす位置のガイド
       ============================== */

    #guide {
      position: absolute;

      top: 0;

      width: 2px;
      height: 80px;

      background-color: #bbbbbb;

      transform: translateX(-50%);
    }


    /* ==============================
       フルーツ
       ============================== */

    .fruit {
      position: absolute;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      user-select: none;
      -webkit-user-select: none;
    }


    /* ==============================
       操作ボタン
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-button {
      font-size: 22px;
      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background-color: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: manipulation;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }


    /* ==============================
       メッセージ
       ============================== */

    #message {
      min-height: 30px;
      margin-top: 15px;
      font-size: 20px;
    }


    /* ==============================
       戻る
       ============================== */

    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      .control-button {
        font-size: 20px;
        padding: 12px 18px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      フルーツを好きな位置から落としてみよう！
    </p>


    <!-- ゲーム画面 -->

    <div id="gameContainer">

      <div id="guide"></div>

    </div>


    <!-- 操作 -->

    <div class="controls">

      <button
        class="control-button"
        onclick="moveLeft()">

        ←

      </button>


      <button
        class="control-button"
        id="dropButton"
        onclick="dropFruit()">

        落とす！

      </button>


      <button
        class="control-button"
        onclick="moveRight()">

        →

      </button>

    </div>


    <div id="message">
      左右に動かして落としてみよう！
    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>



  <script>

    // ========================================
    // 基本設定
    // ========================================

    const gameContainer =
      document.getElementById(
        "gameContainer"
      );


    const guide =
      document.getElementById(
        "guide"
      );


    const dropButton =
      document.getElementById(
        "dropButton"
      );


    let currentFruit = null;

    let fruitX = 155;

    let dropping = false;



    // ========================================
    // 新しいフルーツを作る
    // ========================================

    function createFruit() {

      const fruit =
        document.createElement(
          "div"
        );


      fruit.classList.add(
        "fruit"
      );


      fruit.textContent =
        "🍒";


      gameContainer.appendChild(
        fruit
      );


      currentFruit =
        fruit;


      // 真ん中に出す

      fruitX =
        (
          gameContainer.clientWidth
          - 50
        ) / 2;


      currentFruit.style.left =
        fruitX + "px";


      currentFruit.style.top =
        "20px";


      updateGuide();


      dropping =
        false;


      dropButton.disabled =
        false;

    }



    // ========================================
    // 左へ移動
    // ========================================

    function moveLeft() {

      if (
        dropping ||
        currentFruit === null
      ) {

        return;

      }


      fruitX =
        fruitX - 20;


      if (fruitX < 0) {

        fruitX =
          0;

      }


      currentFruit.style.left =
        fruitX + "px";


      updateGuide();

    }



    // ========================================
    // 右へ移動
    // ========================================

    function moveRight() {

      if (
        dropping ||
        currentFruit === null
      ) {

        return;

      }


      fruitX =
        fruitX + 20;


      const maxX =
        gameContainer.clientWidth
        - 50;


      if (fruitX > maxX) {

        fruitX =
          maxX;

      }


      currentFruit.style.left =
        fruitX + "px";


      updateGuide();

    }



    // ========================================
    // ガイド線
    // ========================================

    function updateGuide() {

      guide.style.left =
        (
          fruitX + 25
        ) + "px";

    }



    // ========================================
    // フルーツを落とす
    // ========================================

    function dropFruit() {

      if (
        dropping ||
        currentFruit === null
      ) {

        return;

      }


      dropping =
        true;


      dropButton.disabled =
        true;


      const fallingFruit =
        currentFruit;


      currentFruit =
        null;


      let y =
        20;


      // ========================================
      // 落下アニメーション
      // ========================================

      const fallTimer =
        setInterval(
          function() {

            y =
              y + 10;


            fallingFruit.style.top =
              y + "px";


            const floor =
              gameContainer.clientHeight
              - 50;


            if (y >= floor) {

              fallingFruit.style.top =
                floor + "px";


              clearInterval(
                fallTimer
              );


              // 少し待って次のフルーツ

              setTimeout(
                function() {

                  createFruit();

                },
                300
              );

            }

          },
          16
        );

    }



    // ========================================
    // キーボード操作
    // ========================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "ArrowLeft") {

          event.preventDefault();

          moveLeft();

        }


        if (event.key === "ArrowRight") {

          event.preventDefault();

          moveRight();

        }


        if (
          event.key === "ArrowDown" ||
          event.key === " "
        ) {

          event.preventDefault();

          dropFruit();

        }

      }
    );



    // ========================================
    // 最初のフルーツ
    // ========================================

    createFruit();

  </script>


</body>

</html>
