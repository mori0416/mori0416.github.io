<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 01 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .game-area {
      margin: 0 auto 30px;
      padding: 40px;
      border: 2px solid #333333;
      min-height: 300px;
    }

    .info {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .score {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .player-name {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .player-name input {
      width: 200px;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #aaaaaa;
      border-radius: 5px;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      cursor: pointer;
      margin: 10px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #message {
      font-size: 22px;
      margin-top: 20px;
      min-height: 30px;
    }


    /* ==============================
       ランキング
       ============================== */

    #ranking {
      max-width: 650px;
      margin: 40px auto 0;
      padding-top: 20px;
      border-top: 2px solid #dddddd;
    }

    #ranking h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    .ranking-table th {
      background-color: #333333;
      color: #ffffff;
      padding: 12px;
      font-size: 18px;
    }

    .ranking-table td {
      padding: 12px;
      border-bottom: 1px solid #dddddd;
      font-size: 18px;
    }

    .ranking-rank {
      width: 20%;
      text-align: center;
    }

    .ranking-name {
      width: 50%;
      text-align: center;
    }

    .ranking-score {
      width: 30%;
      text-align: center;
      font-weight: bold;
    }


    /* 1位 */
    .rank-1 {
      background-color: #ffe98a;
      font-weight: bold;
      font-size: 20px;
    }

    /* 2位 */
    .rank-2 {
      background-color: #e5e5e5;
      font-weight: bold;
    }

    /* 3位 */
    .rank-3 {
      background-color: #f4c28b;
      font-weight: bold;
    }


    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* スマホ用 */
    @media (max-width: 600px) {

      .game-area {
        padding: 25px 15px;
      }

      .player-name input {
        width: 160px;
      }

      .ranking-table th,
      .ranking-table td {
        padding: 10px 5px;
        font-size: 16px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 01</h1>

    <div class="game-area">

      <div class="info">
        残り時間：<span id="time">10</span>秒
      </div>

      <div class="score">
        スコア：<span id="score">0</span>
      </div>


      <!-- 名前入力 -->

      <div class="player-name">

        名前：

        <input
          type="text"
          id="playerName"
          maxlength="12"
          placeholder="名前を入力">

      </div>


      <!-- ゲームボタン -->

      <button id="startButton" onclick="startGame()">
        スタート！
      </button>

      <br>

      <button id="clickButton" onclick="addScore()" disabled>
        クリック！
      </button>


      <div id="message"></div>


      <!-- ランキング -->

      <div id="ranking">

        <h2>🏆 ランキング</h2>

        <table class="ranking-table">

          <thead>

            <tr>
              <th>順位</th>
              <th>名前</th>
              <th>スコア</th>
            </tr>

          </thead>

          <tbody id="rankingBody">

            <tr>
              <td colspan="3">
                読み込み中...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>



  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ========================================
    // Supabase
    // ========================================

    const SUPABASE_URL =
      "https://vyvbgeqcnrouwpmjwzph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CEACy8FVXvk1IVVh5QtSCA_jiNLwHTT";


    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );



    // ========================================
    // ゲーム
    // ========================================

    let score = 0;
    let time = 10;
    let timer;



    function startGame() {

      const playerName =
        document.getElementById("playerName").value.trim();


      // 名前が空欄ならゲームを開始しない

      if (playerName === "") {

        document.getElementById("message").textContent =
          "名前を入力してください！";

        return;
      }


      score = 0;
      time = 10;


      document.getElementById("score").textContent =
        score;

      document.getElementById("time").textContent =
        time;


      document.getElementById("startButton").disabled =
        true;

      document.getElementById("clickButton").disabled =
        false;


      document.getElementById("message").textContent =
        "";


      timer = setInterval(function() {

        time = time - 1;

        document.getElementById("time").textContent =
          time;


        if (time <= 0) {

          endGame();

        }

      }, 1000);

    }



    function addScore() {

      score = score + 1;

      document.getElementById("score").textContent =
        score;

    }



    function endGame() {

      clearInterval(timer);


      document.getElementById("clickButton").disabled =
        true;

      document.getElementById("startButton").disabled =
        false;


      document.getElementById("message").textContent =
        "ゲーム終了！ スコアは " + score + " でした！";


      saveScore();

    }



    // ========================================
    // スコア保存
    // ========================================

    async function saveScore() {

      const playerName =
        document.getElementById("playerName").value.trim();


      const { error } = await supabaseClient
        .from("game01_scores")
        .insert([
          {
            player_name: playerName,
            score: score
          }
        ]);


      if (error) {

        console.log(
          "スコア保存エラー:",
          error
        );

      } else {

        console.log(
          "スコアを保存しました！"
        );


        // 保存後ランキング更新

        loadRanking();

      }

    }



    // ========================================
    // ランキング取得
    // ========================================

    async function loadRanking() {

      const { data, error } = await supabaseClient
        .from("game01_scores")
        .select("player_name, score")
        .order("score", { ascending: false })
        .limit(10);


      if (error) {

        console.log(
          "ランキング取得エラー:",
          error
        );

        return;

      }


      const rankingBody =
        document.getElementById("rankingBody");


      rankingBody.innerHTML = "";



      // ========================================
      // ランキングを1行ずつ作成
      // ========================================

      data.forEach(function(item, index) {

        const rank =
          index + 1;


        const row =
          document.createElement("tr");


        // 1〜3位の色を変更

        if (rank === 1) {

          row.classList.add("rank-1");

        } else if (rank === 2) {

          row.classList.add("rank-2");

        } else if (rank === 3) {

          row.classList.add("rank-3");

        }



        // 順位

        const rankCell =
          document.createElement("td");


        rankCell.classList.add(
          "ranking-rank"
        );


        if (rank === 1) {

          rankCell.textContent =
            "🥇 1";

        } else if (rank === 2) {

          rankCell.textContent =
            "🥈 2";

        } else if (rank === 3) {

          rankCell.textContent =
            "🥉 3";

        } else {

          rankCell.textContent =
            rank;

        }



        // 名前

        const nameCell =
          document.createElement("td");


        nameCell.classList.add(
          "ranking-name"
        );


        nameCell.textContent =
          item.player_name;



        // スコア

        const scoreCell =
          document.createElement("td");


        scoreCell.classList.add(
          "ranking-score"
        );


        scoreCell.textContent =
          item.score + "点";



        // 行に追加

        row.appendChild(
          rankCell
        );

        row.appendChild(
          nameCell
        );

        row.appendChild(
          scoreCell
        );


        // テーブルに追加

        rankingBody.appendChild(
          row
        );

      });

    }



    // ========================================
    // ページを開いたときランキング取得
    // ========================================

    loadRanking();

  </script>


</body>

</html>
