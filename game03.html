<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    /* ==============================
       ゲームエリア
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 20px;

      background-color: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }

    #gameContainer canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ==============================
       次に落とすフルーツ
       ============================== */

    #currentFruit {
      position: absolute;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      z-index: 10;

      user-select: none;
      -webkit-user-select: none;

      pointer-events: none;
    }

    /* ==============================
       ガイド
       ============================== */

    #guide {
      position: absolute;

      top: 50px;

      width: 2px;
      height: 100px;

      background-color: #bbbbbb;

      z-index: 5;

      transform: translateX(-50%);

      pointer-events: none;
    }

    /* ==============================
       操作
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-button {
      font-size: 22px;

      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background-color: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: manipulation;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #message {
      min-height: 30px;
      margin-top: 15px;
      font-size: 20px;
    }

    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }

    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      .control-button {
        font-size: 20px;
        padding: 12px 18px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      同じフルーツをぶつけて合体させよう！<br>
      🍒 → 🍓 → 🍊 → 🍎 → 🍉
    </p>


    <div id="gameContainer">

      <div id="guide"></div>

      <div id="currentFruit">
        🍒
      </div>

    </div>


    <div class="controls">

      <button
        class="control-button"
        onclick="moveLeft()">
        ←
      </button>

      <button
        class="control-button"
        id="dropButton"
        onclick="dropFruit()">
        落とす！
      </button>

      <button
        class="control-button"
        onclick="moveRight()">
        →
      </button>

    </div>


    <div id="message">
      🍒を2個ぶつけてみよう！
    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>


  <!-- Matter.js -->

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js">
  </script>


  <script>

    // ========================================
    // Matter.js
    // ========================================

    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;
    const Events = Matter.Events;


    // ========================================
    // HTML
    // ========================================

    const gameContainer =
      document.getElementById("gameContainer");

    const currentFruit =
      document.getElementById("currentFruit");

    const guide =
      document.getElementById("guide");

    const dropButton =
      document.getElementById("dropButton");


    // ========================================
    // フルーツ設定
    // ========================================

    const fruits = [

      {
        emoji: "🍒",
        radius: 22
      },

      {
        emoji: "🍓",
        radius: 28
      },

      {
        emoji: "🍊",
        radius: 35
      },

      {
        emoji: "🍎",
        radius: 43
      },

      {
        emoji: "🍉",
        radius: 55
      }

    ];


    // ========================================
    // ゲームサイズ
    // ========================================

    let gameWidth =
      gameContainer.clientWidth;

    let gameHeight =
      gameContainer.clientHeight;


    // 最初は🍒

    let currentFruitType = 0;

    let fruitX =
      gameWidth / 2;

    let canDrop =
      true;


    // ========================================
    // エンジン
    // ========================================

    const engine =
      Engine.create();

    engine.gravity.y =
      1;


    // ========================================
    // 描画
    // ========================================

    const render =
      Render.create({

        element:
          gameContainer,

        engine:
          engine,

        options: {

          width:
            gameWidth,

          height:
            gameHeight,

          wireframes:
            false,

          background:
            "transparent"

        }

      });


    Render.run(
      render
    );


    const runner =
      Runner.create();


    Runner.run(
      runner,
      engine
    );


    // ========================================
    // 壁・床
    // ========================================

    function createWalls() {

      const wallThickness =
        40;


      const floor =
        Bodies.rectangle(

          gameWidth / 2,

          gameHeight + 20,

          gameWidth,

          wallThickness,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const leftWall =
        Bodies.rectangle(

          -20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const rightWall =
        Bodies.rectangle(

          gameWidth + 20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      Composite.add(

        engine.world,

        [
          floor,
          leftWall,
          rightWall
        ]

      );

    }


    createWalls();


    // ========================================
    // フルーツ本体を作る
    // ========================================

    function createPhysicsFruit(
      x,
      y,
      type
    ) {

      const fruitData =
        fruits[type];


      const fruit =
        Bodies.circle(

          x,

          y,

          fruitData.radius,

          {

            restitution:
              0.15,

            friction:
              0.3,

            frictionStatic:
              0.5,

            density:
              0.001,

            render: {

              fillStyle:
                "transparent",

              strokeStyle:
                "transparent",

              lineWidth:
                0

            }

          }

        );


      // 独自データ

      fruit.fruitType =
        type;


      // 合体処理中かどうか

      fruit.merging =
        false;


      Composite.add(
        engine.world,
        fruit
      );


      return fruit;

    }


    // ========================================
    // 上にあるフルーツを表示
    // ========================================

    function updateCurrentFruit() {

      const fruitData =
        fruits[currentFruitType];


      const diameter =
        fruitData.radius * 2;


      currentFruit.textContent =
        fruitData.emoji;


      currentFruit.style.width =
        diameter + "px";


      currentFruit.style.height =
        diameter + "px";


      currentFruit.style.fontSize =
        diameter * 0.8 + "px";


      // 壁から出ないようにする

      if (
        fruitX <
        fruitData.radius
      ) {

        fruitX =
          fruitData.radius;

      }


      if (
        fruitX >
        gameWidth -
        fruitData.radius
      ) {

        fruitX =
          gameWidth -
          fruitData.radius;

      }


      currentFruit.style.left =
        (
          fruitX -
          fruitData.radius
        ) + "px";


      currentFruit.style.top =
        "10px";


      guide.style.left =
        fruitX + "px";

    }


    updateCurrentFruit();


    // ========================================
    // 左へ移動
    // ========================================

    function moveLeft() {

      if (!canDrop) {
        return;
      }


      const radius =
        fruits[currentFruitType].radius;


      fruitX =
        fruitX - 20;


      if (
        fruitX < radius
      ) {

        fruitX =
          radius;

      }


      updateCurrentFruit();

    }


    // ========================================
    // 右へ移動
    // ========================================

    function moveRight() {

      if (!canDrop) {
        return;
      }


      const radius =
        fruits[currentFruitType].radius;


      fruitX =
        fruitX + 20;


      if (
        fruitX >
        gameWidth - radius
      ) {

        fruitX =
          gameWidth - radius;

      }


      updateCurrentFruit();

    }


    // ========================================
    // 落とす
    // ========================================

    function dropFruit() {

      if (!canDrop) {
        return;
      }


      canDrop =
        false;


      dropButton.disabled =
        true;


      currentFruit.style.display =
        "none";


      const radius =
        fruits[currentFruitType].radius;


      createPhysicsFruit(

        fruitX,

        20 + radius,

        currentFruitType

      );


      // ========================================
      // 次のフルーツ
      // 今は🍒だけ出す
      // ========================================

      setTimeout(
        function() {

          currentFruitType =
            0;


          fruitX =
            gameWidth / 2;


          canDrop =
            true;


          dropButton.disabled =
            false;


          currentFruit.style.display =
            "flex";


          updateCurrentFruit();

        },

        500
      );

    }


    // ========================================
    // 衝突したとき
    // ========================================

    Events.on(

      engine,

      "collisionStart",

      function(event) {

        const pairs =
          event.pairs;


        pairs.forEach(
          function(pair) {

            const bodyA =
              pair.bodyA;

            const bodyB =
              pair.bodyB;


            // フルーツ以外なら無視

            if (
              bodyA.fruitType === undefined ||
              bodyB.fruitType === undefined
            ) {

              return;

            }


            // 違う種類なら無視

            if (
              bodyA.fruitType !==
              bodyB.fruitType
            ) {

              return;

            }


            // 🍉はそれ以上合体しない

            if (
              bodyA.fruitType >=
              fruits.length - 1
            ) {

              return;

            }


            // すでに合体処理中なら無視

            if (
              bodyA.merging ||
              bodyB.merging
            ) {

              return;

            }


            bodyA.merging =
              true;

            bodyB.merging =
              true;


            const newType =
              bodyA.fruitType + 1;


            // 2個の中間地点

            const newX =
              (
                bodyA.position.x +
                bodyB.position.x
              ) / 2;


            const newY =
              (
                bodyA.position.y +
                bodyB.position.y
              ) / 2;


            // ========================================
            // 2個を削除
            // ========================================

            Composite.remove(
              engine.world,
              bodyA
            );


            Composite.remove(
              engine.world,
              bodyB
            );


            // ========================================
            // 大きいフルーツを作る
            // ========================================

            createPhysicsFruit(

              newX,

              newY,

              newType

            );

          }
        );

      }

    );


    // ========================================
    // フルーツをCanvasに描画
    // ========================================

    Events.on(

      render,

      "afterRender",

      function() {

        const context =
          render.context;


        const bodies =
          Composite.allBodies(
            engine.world
          );


        bodies.forEach(
          function(body) {

            if (
              body.fruitType ===
              undefined
            ) {

              return;

            }


            const fruitData =
              fruits[
                body.fruitType
              ];


            context.save();


            context.translate(
              body.position.x,
              body.position.y
            );


            context.rotate(
              body.angle
            );


            context.font =
              (
                fruitData.radius *
                1.65
              ) +
              "px Arial";


            context.textAlign =
              "center";


            context.textBaseline =
              "middle";


            context.fillText(
              fruitData.emoji,
              0,
              1
            );


            context.restore();

          }
        );

      }

    );


    // ========================================
    // キーボード
    // ========================================

    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          moveLeft();

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          moveRight();

        }


        if (
          event.key ===
          "ArrowDown" ||
          event.key === " "
        ) {

          event.preventDefault();

          dropFruit();

        }

      }

    );

  </script>

</body>

</html>
