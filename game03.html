<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 20px;
    }


    /* ==============================
       ゲームエリア
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 20px;

      background-color: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }


    /* Matter.jsのCanvas */

    #gameContainer canvas {
      position: absolute;
      top: 0;
      left: 0;
    }


    /* ==============================
       次に落とすフルーツ
       ============================== */

    #currentFruit {
      position: absolute;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      z-index: 10;

      user-select: none;
      -webkit-user-select: none;

      pointer-events: none;
    }


    /* ==============================
       ガイド線
       ============================== */

    #guide {
      position: absolute;

      top: 50px;

      width: 2px;
      height: 100px;

      background-color: #bbbbbb;

      z-index: 5;

      transform: translateX(-50%);

      pointer-events: none;
    }


    /* ==============================
       操作
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-button {
      font-size: 22px;

      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background-color: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: manipulation;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }


    #message {
      min-height: 30px;

      margin-top: 15px;

      font-size: 20px;
    }


    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      .control-button {
        font-size: 20px;
        padding: 12px 18px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      フルーツを落として積み上げよう！
    </p>


    <!-- ゲーム画面 -->

    <div id="gameContainer">

      <div id="guide"></div>

      <div id="currentFruit">
        🍒
      </div>

    </div>


    <!-- 操作 -->

    <div class="controls">

      <button
        class="control-button"
        onclick="moveLeft()">

        ←

      </button>


      <button
        class="control-button"
        id="dropButton"
        onclick="dropFruit()">

        落とす！

      </button>


      <button
        class="control-button"
        onclick="moveRight()">

        →

      </button>

    </div>


    <div id="message">
      左右に動かして落としてみよう！
    </div>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>



  <!-- ==============================
       Matter.js
       ============================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js">
  </script>


  <script>

    // ========================================
    // Matter.js
    // ========================================

    const Engine =
      Matter.Engine;

    const Render =
      Matter.Render;

    const Runner =
      Matter.Runner;

    const Bodies =
      Matter.Bodies;

    const Composite =
      Matter.Composite;



    // ========================================
    // HTML
    // ========================================

    const gameContainer =
      document.getElementById(
        "gameContainer"
      );


    const currentFruit =
      document.getElementById(
        "currentFruit"
      );


    const guide =
      document.getElementById(
        "guide"
      );


    const dropButton =
      document.getElementById(
        "dropButton"
      );



    // ========================================
    // サイズ
    // ========================================

    let gameWidth =
      gameContainer.clientWidth;


    let gameHeight =
      gameContainer.clientHeight;


    const fruitRadius =
      24;



    // ========================================
    // エンジン作成
    // ========================================

    const engine =
      Engine.create();


    engine.gravity.y =
      1;



    // ========================================
    // 描画
    // ========================================

    const render =
      Render.create({

        element:
          gameContainer,

        engine:
          engine,

        options: {

          width:
            gameWidth,

          height:
            gameHeight,

          wireframes:
            false,

          background:
            "transparent"

        }

      });


    Render.run(
      render
    );



    // ========================================
    // Runner
    // ========================================

    const runner =
      Runner.create();


    Runner.run(
      runner,
      engine
    );



    // ========================================
    // 壁と床
    // ========================================

    function createWalls() {

      const wallThickness =
        40;


      // 床

      const floor =
        Bodies.rectangle(

          gameWidth / 2,

          gameHeight + 20,

          gameWidth,

          wallThickness,

          {
            isStatic:
              true,

            render: {
              visible:
                false
            }
          }

        );


      // 左壁

      const leftWall =
        Bodies.rectangle(

          -20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {
            isStatic:
              true,

            render: {
              visible:
                false
            }
          }

        );


      // 右壁

      const rightWall =
        Bodies.rectangle(

          gameWidth + 20,

          gameHeight / 2,

          wallThickness,

          gameHeight,

          {
            isStatic:
              true,

            render: {
              visible:
                false
            }
          }

        );


      Composite.add(

        engine.world,

        [
          floor,
          leftWall,
          rightWall
        ]

      );

    }


    createWalls();



    // ========================================
    // フルーツ位置
    // ========================================

    let fruitX =
      gameWidth / 2;


    let canDrop =
      true;



    // ========================================
    // 上のフルーツ表示
    // ========================================

    function updateCurrentFruit() {

      currentFruit.style.left =
        (
          fruitX -
          fruitRadius
        ) + "px";


      currentFruit.style.top =
        "15px";


      guide.style.left =
        fruitX + "px";

    }


    updateCurrentFruit();



    // ========================================
    // 左
    // ========================================

    function moveLeft() {

      if (!canDrop) {

        return;

      }


      fruitX =
        fruitX - 20;


      if (
        fruitX <
        fruitRadius
      ) {

        fruitX =
          fruitRadius;

      }


      updateCurrentFruit();

    }



    // ========================================
    // 右
    // ========================================

    function moveRight() {

      if (!canDrop) {

        return;

      }


      fruitX =
        fruitX + 20;


      if (
        fruitX >
        gameWidth -
        fruitRadius
      ) {

        fruitX =
          gameWidth -
          fruitRadius;

      }


      updateCurrentFruit();

    }



    // ========================================
    // フルーツを落とす
    // ========================================

    function dropFruit() {

      if (!canDrop) {

        return;

      }


      canDrop =
        false;


      dropButton.disabled =
        true;


      currentFruit.style.display =
        "none";


      // ========================================
      // Matter.jsの丸を作る
      // ========================================

      const fruit =
        Bodies.circle(

          fruitX,

          45,

          fruitRadius,

          {

            restitution:
              0.15,

            friction:
              0.3,

            frictionStatic:
              0.5,

            density:
              0.001,


            render: {

              fillStyle:
                "#ffb6c1",

              strokeStyle:
                "#cc6677",

              lineWidth:
                2

            }

          }

        );


      // フルーツだと分かるように
      // 独自情報を追加

      fruit.fruitType =
        0;


      Composite.add(

        engine.world,

        fruit

      );



      // ========================================
      // 次のフルーツを準備
      // ========================================

      setTimeout(
        function() {

          canDrop =
            true;


          dropButton.disabled =
            false;


          currentFruit.style.display =
            "flex";


          fruitX =
            gameWidth / 2;


          updateCurrentFruit();

        },

        500
      );

    }



    // ========================================
    // Canvasに🍒を描く
    // ========================================

    Matter.Events.on(

      render,

      "afterRender",

      function() {

        const context =
          render.context;


        const bodies =
          Composite.allBodies(
            engine.world
          );


        bodies.forEach(
          function(body) {

            if (
              body.fruitType ===
              undefined
            ) {

              return;

            }


            context.save();


            context.translate(
              body.position.x,
              body.position.y
            );


            context.rotate(
              body.angle
            );


            context.font =
              "40px Arial";


            context.textAlign =
              "center";


            context.textBaseline =
              "middle";


            context.fillText(
              "🍒",
              0,
              1
            );


            context.restore();

          }
        );

      }

    );



    // ========================================
    // キーボード
    // ========================================

    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          moveLeft();

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          moveRight();

        }


        if (
          event.key ===
          "ArrowDown" ||
          event.key ===
          " "
        ) {

          event.preventDefault();

          dropFruit();

        }

      }

    );

  </script>

</body>

</html>
