<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mori's Game Site</title>

  <style>
    .games {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: 50px auto;
    }

    .games img {
      width: calc((100% - 40px) / 3);
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <h1>Mori's Game Site</h1>

  <div class="games">
    <img src="game01.JPG" alt="Game 01">
    <img src="game02.JPG" alt="Game 02">
    <img src="game03.JPG" alt="Game 03">
  </div>

</body>
</html>
