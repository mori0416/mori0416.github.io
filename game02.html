<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 02 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      margin-bottom: 20px;
    }

    .info {
      font-size: 24px;
      margin-bottom: 15px;
    }

    #gameArea {
      position: relative;

      width: 100%;
      max-width: 700px;
      height: 450px;

      margin: 0 auto;

      border: 3px solid #333333;
      background-color: #f5f5f5;

      overflow: hidden;

      box-sizing: border-box;
    }


    /* プレイヤー */

    #player {
      position: absolute;

      width: 50px;
      height: 50px;

      left: 325px;
      top: 200px;

      background-color: #3498db;

      border-radius: 8px;
    }


    /* 飛んでくる球 */

    .ball {
      position: absolute;

      width: 30px;
      height: 30px;

      background-color: #e74c3c;

      border-radius: 50%;
    }


    /* スタートボタン */

    #startButton {
      font-size: 22px;

      padding: 12px 30px;

      margin: 20px 0;

      cursor: pointer;
    }


    /* 操作ボタン */

    .controls {
      margin-top: 20px;
    }

    .control-row {
      margin: 5px 0;
    }

    .moveButton {
      width: 80px;
      height: 55px;

      margin: 3px;

      font-size: 26px;

      cursor: pointer;

      touch-action: none;
    }


    #message {
      min-height: 35px;

      margin-top: 15px;

      font-size: 24px;
      font-weight: bold;
    }


    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background-color: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }


    /* スマホ */

    @media (max-width: 600px) {

      main {
        padding: 20px 10px;
      }

      #gameArea {
        height: 400px;
      }

      .moveButton {
        width: 70px;
        height: 50px;
      }

    }

  </style>
</head>


<body>

  <main>

    <h1>Game 02</h1>

    <p class="description">
      四方から飛んでくる球を避けよう！
    </p>


    <div class="info">
      生存時間：
      <span id="time">0.0</span> 秒
    </div>


    <button
      id="startButton"
      onclick="startGame()">

      スタート！

    </button>


    <div id="gameArea">

      <div id="player"></div>

    </div>


    <!-- 操作ボタン -->

    <div class="controls">

      <div class="control-row">

        <button
          class="moveButton"
          id="upButton">

          ↑

        </button>

      </div>


      <div class="control-row">

        <button
          class="moveButton"
          id="leftButton">

          ←

        </button>

        <button
          class="moveButton"
          id="downButton">

          ↓

        </button>

        <button
          class="moveButton"
          id="rightButton">

          →

        </button>

      </div>

    </div>


    <div id="message"></div>


    <a
      class="back"
      href="index.html">

      ← ゲーム一覧に戻る

    </a>

  </main>



  <script>

    // ========================================
    // 基本設定
    // ========================================

    const gameArea =
      document.getElementById("gameArea");

    const player =
      document.getElementById("player");


    let gameRunning = false;

    let playerX = 0;
    let playerY = 0;

    let moveLeft = false;
    let moveRight = false;
    let moveUp = false;
    let moveDown = false;

    let balls = [];

    let startTime = 0;
    let lastBallTime = 0;

    let animationId;



    // ========================================
    // ゲーム開始
    // ========================================

    function startGame() {

      // 前の球を全部削除

      balls.forEach(function(ballData) {

        ballData.element.remove();

      });

      balls = [];


      gameRunning = true;


      document.getElementById("message").textContent =
        "";

      document.getElementById("startButton").disabled =
        true;

      document.getElementById("time").textContent =
        "0.0";


      // プレイヤーを中央に配置

      playerX =
        (gameArea.clientWidth - player.offsetWidth) / 2;

      playerY =
        (gameArea.clientHeight - player.offsetHeight) / 2;


      player.style.left =
        playerX + "px";

      player.style.top =
        playerY + "px";


      startTime =
        performance.now();

      lastBallTime =
        startTime;


      animationId =
        requestAnimationFrame(gameLoop);

    }



    // ========================================
    // メインループ
    // ========================================

    function gameLoop(currentTime) {

      if (!gameRunning) {
        return;
      }


      // 生存時間

      const survivalTime =
        (currentTime - startTime) / 1000;


      document.getElementById("time").textContent =
        survivalTime.toFixed(1);



      // ========================================
      // プレイヤー移動
      // ========================================

      const playerSpeed = 6;


      if (moveLeft) {
        playerX -= playerSpeed;
      }

      if (moveRight) {
        playerX += playerSpeed;
      }

      if (moveUp) {
        playerY -= playerSpeed;
      }

      if (moveDown) {
        playerY += playerSpeed;
      }


      // 画面外に出ないようにする

      const maxPlayerX =
        gameArea.clientWidth -
        player.offsetWidth;

      const maxPlayerY =
        gameArea.clientHeight -
        player.offsetHeight;


      if (playerX < 0) {
        playerX = 0;
      }

      if (playerX > maxPlayerX) {
        playerX = maxPlayerX;
      }

      if (playerY < 0) {
        playerY = 0;
      }

      if (playerY > maxPlayerY) {
        playerY = maxPlayerY;
      }


      player.style.left =
        playerX + "px";

      player.style.top =
        playerY + "px";



      // ========================================
      // 球を作る
      // ========================================

      const ballInterval =
        Math.max(
          250,
          850 - survivalTime * 15
        );


      if (
        currentTime - lastBallTime >
        ballInterval
      ) {

        createBall(
          survivalTime
        );

        lastBallTime =
          currentTime;

      }



      // ========================================
      // 球を動かす
      // ========================================

      for (
        let i = balls.length - 1;
        i >= 0;
        i--
      ) {

        const ballData =
          balls[i];


        ballData.x +=
          ballData.vx;

        ballData.y +=
          ballData.vy;


        ballData.element.style.left =
          ballData.x + "px";

        ballData.element.style.top =
          ballData.y + "px";



        // 当たり判定

        if (
          checkCollision(
            player,
            ballData.element
          )
        ) {

          endGame(
            survivalTime
          );

          return;

        }



        // 画面外へ出た球を削除

        if (
          ballData.x < -60 ||
          ballData.x >
            gameArea.clientWidth + 60 ||
          ballData.y < -60 ||
          ballData.y >
            gameArea.clientHeight + 60
        ) {

          ballData.element.remove();

          balls.splice(
            i,
            1
          );

        }

      }


      animationId =
        requestAnimationFrame(
          gameLoop
        );

    }



    // ========================================
    // 四方から球を作る
    // ========================================

    function createBall(survivalTime) {

      const ball =
        document.createElement("div");


      ball.classList.add(
        "ball"
      );


      gameArea.appendChild(
        ball
      );


      const ballSize = 30;

      const width =
        gameArea.clientWidth;

      const height =
        gameArea.clientHeight;


      // 0 = 上
      // 1 = 右
      // 2 = 下
      // 3 = 左

      const side =
        Math.floor(
          Math.random() * 4
        );


      let x;
      let y;

      let vx = 0;
      let vy = 0;


      // 時間が経つほど速くなる

      const speed =
        3 +
        Math.min(
          survivalTime * 0.06,
          4
        );



      // ========================================
      // 上から
      // ========================================

      if (side === 0) {

        x =
          Math.random() *
          (width - ballSize);

        y =
          -ballSize;

        vx = 0;

        vy = speed;

      }



      // ========================================
      // 右から
      // ========================================

      if (side === 1) {

        x =
          width;

        y =
          Math.random() *
          (height - ballSize);

        vx =
          -speed;

        vy = 0;

      }



      // ========================================
      // 下から
      // ========================================

      if (side === 2) {

        x =
          Math.random() *
          (width - ballSize);

        y =
          height;

        vx = 0;

        vy =
          -speed;

      }



      // ========================================
      // 左から
      // ========================================

      if (side === 3) {

        x =
          -ballSize;

        y =
          Math.random() *
          (height - ballSize);

        vx =
          speed;

        vy = 0;

      }


      ball.style.left =
        x + "px";

      ball.style.top =
        y + "px";


      balls.push({

        element: ball,

        x: x,
        y: y,

        vx: vx,
        vy: vy

      });

    }



    // ========================================
    // 当たり判定
    // ========================================

    function checkCollision(
      playerElement,
      ballElement
    ) {

      const playerRect =
        playerElement.getBoundingClientRect();

      const ballRect =
        ballElement.getBoundingClientRect();


      return !(
        playerRect.right <
          ballRect.left ||

        playerRect.left >
          ballRect.right ||

        playerRect.bottom <
          ballRect.top ||

        playerRect.top >
          ballRect.bottom
      );

    }



    // ========================================
    // ゲーム終了
    // ========================================

    function endGame(
      survivalTime
    ) {

      gameRunning =
        false;


      cancelAnimationFrame(
        animationId
      );


      moveLeft = false;
      moveRight = false;
      moveUp = false;
      moveDown = false;


      document.getElementById("startButton").disabled =
        false;


      document.getElementById("message").textContent =
        "ゲームオーバー！ " +
        survivalTime.toFixed(1) +
        "秒 生き残りました！";

    }



    // ========================================
    // キーボード操作
    // ========================================

    document.addEventListener(
      "keydown",
      function(event) {

            if (
      gameRunning &&
      (
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight" ||
        event.key === "ArrowUp" ||
        event.key === "ArrowDown"
      )
    ) {
      event.preventDefault();
    }

        if (
          event.key === "ArrowLeft" ||
          event.key === "a" ||
          event.key === "A"
        ) {

          moveLeft = true;

        }


        if (
          event.key === "ArrowRight" ||
          event.key === "d" ||
          event.key === "D"
        ) {

          moveRight = true;

        }


        if (
          event.key === "ArrowUp" ||
          event.key === "w" ||
          event.key === "W"
        ) {

          moveUp = true;

        }


        if (
          event.key === "ArrowDown" ||
          event.key === "s" ||
          event.key === "S"
        ) {

          moveDown = true;

        }

      }
    );



    document.addEventListener(
      "keyup",
      function(event) {

        if (
          event.key === "ArrowLeft" ||
          event.key === "a" ||
          event.key === "A"
        ) {

          moveLeft = false;

        }


        if (
          event.key === "ArrowRight" ||
          event.key === "d" ||
          event.key === "D"
        ) {

          moveRight = false;

        }


        if (
          event.key === "ArrowUp" ||
          event.key === "w" ||
          event.key === "W"
        ) {

          moveUp = false;

        }


        if (
          event.key === "ArrowDown" ||
          event.key === "s" ||
          event.key === "S"
        ) {

          moveDown = false;

        }

      }
    );



    // ========================================
    // 操作ボタン
    // ========================================

    setupMoveButton(
      "leftButton",
      function(value) {
        moveLeft = value;
      }
    );


    setupMoveButton(
      "rightButton",
      function(value) {
        moveRight = value;
      }
    );


    setupMoveButton(
      "upButton",
      function(value) {
        moveUp = value;
      }
    );


    setupMoveButton(
      "downButton",
      function(value) {
        moveDown = value;
      }
    );



    function setupMoveButton(
      buttonId,
      setMovement
    ) {

      const button =
        document.getElementById(
          buttonId
        );


      button.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          setMovement(true);

        }
      );


      button.addEventListener(
        "pointerup",
        function() {

          setMovement(false);

        }
      );


      button.addEventListener(
        "pointerleave",
        function() {

          setMovement(false);

        }
      );


      button.addEventListener(
        "pointercancel",
        function() {

          setMovement(false);

        }
      );

    }

  </script>

</body>

</html>
