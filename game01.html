<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 01 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .game-area {
      margin: 0 auto 30px;
      padding: 40px;
      border: 2px solid #333333;
      min-height: 300px;
    }

    .score {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .click-button {
      font-size: 24px;
      padding: 20px 40px;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main>

    <h1>Game 01</h1>

    <div class="game-area">

      <div class="score">
        スコア：<span id="score">0</span>
      </div>

      <button class="click-button" onclick="addScore()">
        クリック！
      </button>

    </div>

    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>

  <script>

    let score = 0;

    function addScore() {
      score = score + 1;
      document.getElementById("score").textContent = score;
    }

  </script>

</body>

</html>
