<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 01 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .game-area {
      margin: 0 auto 30px;
      padding: 40px;
      border: 2px solid #333333;
      min-height: 300px;
    }

    .info {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .score {
      font-size: 30px;
      margin-bottom: 20px;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      cursor: pointer;
      margin: 10px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #message {
      font-size: 22px;
      margin-top: 20px;
    }

    .back {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }

    .back:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main>

    <h1>Game 01</h1>

    <div class="game-area">

      <div class="info">
        残り時間：<span id="time">10</span>秒
      </div>

      <div class="score">
        スコア：<span id="score">0</span>
      </div>

      <button id="startButton" onclick="startGame()">
        スタート！
      </button>

      <br>

      <button id="clickButton" onclick="addScore()" disabled>
        クリック！
      </button>

      <div id="message"></div>

    </div>

    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>

  <script>

    let score = 0;
    let time = 10;
    let timer;

    function startGame() {

      score = 0;
      time = 10;

      document.getElementById("score").textContent = score;
      document.getElementById("time").textContent = time;

      document.getElementById("startButton").disabled = true;
      document.getElementById("clickButton").disabled = false;

      document.getElementById("message").textContent = "";

      timer = setInterval(function() {

        time = time - 1;

        document.getElementById("time").textContent = time;

        if (time <= 0) {
          endGame();
        }

      }, 1000);
    }

    function addScore() {

      score = score + 1;

      document.getElementById("score").textContent = score;
    }

    function endGame() {

      clearInterval(timer);

      document.getElementById("clickButton").disabled = true;
      document.getElementById("startButton").disabled = false;

      document.getElementById("message").textContent =
        "ゲーム終了！ スコアは " + score + " でした！";
    }

  </script>

</body>

</html>
