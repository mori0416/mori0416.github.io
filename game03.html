<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game 03 - Mori's Game Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #333333;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 25px 20px;
    }

    h1 {
      margin: 0 0 10px;
    }

    .description {
      font-size: 17px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    /* ==============================
       名前
       ============================== */

    .name-area {
      margin-bottom: 15px;
    }

    #playerName {
      width: 180px;
      font-size: 18px;
      padding: 8px 10px;
      border: 2px solid #cccccc;
      border-radius: 6px;
      text-align: center;
    }

    /* ==============================
       SCORE / NEXT
       ============================== */

    .game-info {
      width: 360px;
      margin: 0 auto 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #scoreDisplay {
      font-size: 26px;
      font-weight: bold;
    }

    #nextDisplay {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 18px;
      font-weight: bold;
    }

    #nextFruit {
      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid #555555;
      border-radius: 50%;

      font-size: 32px;
      background: #ffffff;
    }

    /* ==============================
       ゲーム画面
       ============================== */

    #gameContainer {
      position: relative;

      width: 360px;
      height: 520px;

      margin: 0 auto 18px;

      background: #f5f5f5;

      border-left: 5px solid #555555;
      border-right: 5px solid #555555;
      border-bottom: 5px solid #555555;

      overflow: hidden;
    }

    #gameContainer canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ==============================
       GAME OVERライン
       ============================== */

    #dangerLine {
      position: absolute;

      top: 120px;
      left: 0;

      width: 100%;

      border-top: 3px dashed #e53935;

      z-index: 4;

      pointer-events: none;
    }

    #dangerText {
      position: absolute;

      top: 96px;
      right: 5px;

      color: #e53935;

      font-size: 12px;
      font-weight: bold;

      z-index: 4;

      pointer-events: none;
    }

    /* ==============================
       カウントダウン
       ============================== */

    #gameOverCountdown {
      position: absolute;

      top: 128px;
      left: 50%;

      transform: translateX(-50%);

      padding: 5px 12px;

      background: rgba(229, 57, 53, 0.9);
      color: #ffffff;

      border-radius: 15px;

      font-size: 16px;
      font-weight: bold;

      z-index: 20;

      display: none;

      pointer-events: none;
    }

    /* ==============================
       物理フルーツ
       ============================== */

    .physics-fruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 3;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;

      transform-origin: center center;

      /* 描画のガタつきを減らす */
      will-change: transform;
    }

    /* ==============================
       落とす前のフルーツ
       ============================== */

    #currentFruit {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 10;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
    }

    /* ==============================
       ガイド
       ============================== */

    #guide {
      position: absolute;

      top: 65px;

      width: 2px;
      height: 55px;

      background: #aaaaaa;

      z-index: 5;

      transform: translateX(-50%);

      pointer-events: none;
    }

    /* ==============================
       GAME OVER画面
       ============================== */

    #gameOverScreen {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(255, 255, 255, 0.92);

      z-index: 30;

      display: none;

      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #gameOverScreen h2 {
      font-size: 38px;
      margin: 0 0 15px;
      color: #e53935;
    }

    #finalScore {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #saveMessage {
      min-height: 25px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    #restartButton {
      font-size: 20px;

      padding: 12px 25px;

      border: none;
      border-radius: 8px;

      background: #333333;
      color: #ffffff;

      cursor: pointer;
    }

    /* ==============================
       操作
       ============================== */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;
    }

    .control-button {
      font-size: 22px;

      padding: 12px 22px;

      border: none;
      border-radius: 8px;

      background: #333333;
      color: #ffffff;

      cursor: pointer;

      min-width: 80px;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .move-button {
      width: 75px;
      height: 55px;

      padding: 0;

      font-size: 30px;
    }

    .control-button:hover {
      opacity: 0.8;
    }

    .control-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #message {
      min-height: 30px;
      margin-top: 12px;
      font-size: 18px;
    }

    /* ==============================
       ランキング
       ============================== */

    .ranking {
      max-width: 430px;

      margin: 35px auto 0;

      padding: 20px;

      border: 2px solid #dddddd;
      border-radius: 10px;

      background: #fafafa;
    }

    .ranking h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    #rankingList {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ranking-row {
      display: grid;

      grid-template-columns: 65px 1fr 90px;

      align-items: center;

      padding: 10px 5px;

      border-bottom: 1px solid #dddddd;

      font-size: 17px;
    }

    .ranking-row:last-child {
      border-bottom: none;
    }

    .ranking-position {
      font-weight: bold;
    }

    .ranking-name {
      text-align: left;
      overflow-wrap: anywhere;
    }

    .ranking-score {
      text-align: right;
      font-weight: bold;
    }

    .rank1 {
      background: #fff7c2;
    }

    .rank2 {
      background: #eeeeee;
    }

    .rank3 {
      background: #f6dfcc;
    }

    .back {
      display: inline-block;

      margin-top: 25px;

      padding: 10px 20px;

      background: #333333;
      color: #ffffff;

      text-decoration: none;

      border-radius: 5px;
    }

    /* ==============================
       スマホ
       ============================== */

    @media (max-width: 500px) {

      main {
        padding: 20px 10px;
      }

      .game-info {
        width: 300px;
      }

      #gameContainer {
        width: 300px;
        height: 450px;
      }

      #scoreDisplay {
        font-size: 22px;
      }

      #nextDisplay {
        font-size: 16px;
      }

      #nextFruit {
        width: 44px;
        height: 44px;
        font-size: 28px;
      }

      .move-button {
        width: 70px;
      }

      .ranking {
        padding: 15px 10px;
      }

      .ranking-row {
        grid-template-columns: 55px 1fr 75px;
        font-size: 15px;
      }
    }
  </style>
</head>


<body>

  <main>

    <h1>Game 03</h1>

    <p class="description">
      同じフルーツをぶつけて大きくしよう！<br>
      🍒 → 🍓 → 🍊 → 🍎 → 🍉 → 🍑 → 🍍 → 🥥
    </p>


    <!-- 名前 -->

    <div class="name-area">

      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="名前を入力"
      >

    </div>


    <!-- SCORE / NEXT -->

    <div class="game-info">

      <div id="scoreDisplay">
        SCORE：0
      </div>

      <div id="nextDisplay">

        NEXT

        <div id="nextFruit">
          🍒
        </div>

      </div>

    </div>


    <!-- ゲーム画面 -->

    <div id="gameContainer">

      <div id="dangerText">
        GAME OVER LINE
      </div>

      <div id="dangerLine"></div>

      <div id="gameOverCountdown">
        GAME OVERまで 2.0秒
      </div>

      <div id="guide"></div>

      <div id="currentFruit">
        🍒
      </div>


      <!-- GAME OVER -->

      <div id="gameOverScreen">

        <h2>GAME OVER</h2>

        <div id="finalScore">
          SCORE：0
        </div>

        <div id="saveMessage"></div>

        <button id="restartButton">
          もう一度遊ぶ
        </button>

      </div>

    </div>


    <!-- 操作 -->

    <div class="controls">

      <button
        id="leftButton"
        class="control-button move-button">
        ←
      </button>

      <button
        id="dropButton"
        class="control-button">
        落とす！
      </button>

      <button
        id="rightButton"
        class="control-button move-button">
        →
      </button>

    </div>


    <div id="message">
      名前を入力してから遊んでください
    </div>


    <!-- ランキング -->

    <section class="ranking">

      <h2>🏆 TOP 10</h2>

      <ul id="rankingList">
        <li>ランキング読み込み中...</li>
      </ul>

    </section>


    <a class="back" href="index.html">
      ← ゲーム一覧に戻る
    </a>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Matter.js -->

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>


  <script>

    // ========================================
    // Supabase
    // ========================================

    const SUPABASE_URL =
      "https://vyvbgeqcnrouwpmjwzph.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CEACy8FVXvk1IVVh5QtSCA_jiNLwHTT";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ========================================
    // Matter.js
    // ========================================

    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const Runner = Matter.Runner;
    const Bodies = Matter.Bodies;
    const Composite = Matter.Composite;
    const Events = Matter.Events;


    // ========================================
    // HTML
    // ========================================

    const gameContainer =
      document.getElementById("gameContainer");

    const currentFruit =
      document.getElementById("currentFruit");

    const nextFruit =
      document.getElementById("nextFruit");

    const guide =
      document.getElementById("guide");

    const dropButton =
      document.getElementById("dropButton");

    const leftButton =
      document.getElementById("leftButton");

    const rightButton =
      document.getElementById("rightButton");

    const scoreDisplay =
      document.getElementById("scoreDisplay");

    const playerNameInput =
      document.getElementById("playerName");

    const gameOverScreen =
      document.getElementById("gameOverScreen");

    const gameOverCountdown =
      document.getElementById("gameOverCountdown");

    const finalScore =
      document.getElementById("finalScore");

    const saveMessage =
      document.getElementById("saveMessage");

    const restartButton =
      document.getElementById("restartButton");

    const rankingList =
      document.getElementById("rankingList");

    const message =
      document.getElementById("message");


    // ========================================
    // フルーツ
    // ========================================

    const fruits = [

      {
        emoji: "🍒",
        radius: 24,
        color: "#ffd6dc",
        score: 0
      },

      {
        emoji: "🍓",
        radius: 30,
        color: "#ffb6c1",
        score: 10
      },

      {
        emoji: "🍊",
        radius: 37,
        color: "#ffd59a",
        score: 30
      },

      {
        emoji: "🍎",
        radius: 44,
        color: "#ffaaaa",
        score: 60
      },

      {
        emoji: "🍉",
        radius: 53,
        color: "#b8e6b8",
        score: 100
      },

      {
        emoji: "🍑",
        radius: 61,
        color: "#ffd0c2",
        score: 150
      },

      {
        emoji: "🍍",
        radius: 71,
        color: "#ffe48a",
        score: 220
      },

      {
        emoji: "🥥",
        radius: 82,
        color: "#d7c0a5",
        score: 300
      }

    ];


    // ========================================
    // サイズ
    // ========================================

    const gameWidth =
      gameContainer.clientWidth;

    const gameHeight =
      gameContainer.clientHeight;


    // ========================================
    // ゲーム設定
    // ========================================

    const dangerLineY = 120;

    const gameOverTime = 2000;


    let score = 0;

    let gameOver = false;

    let gameStarted = false;

    let scoreSaved = false;

    let canDrop = true;

    let fruitX =
      gameWidth / 2;

    let currentPlayerName = "";


    // ========================================
    // ランダム
    // 🍒 🍓 🍊
    // ========================================

    function randomFruitType() {

      return Math.floor(
        Math.random() * 3
      );

    }


    let currentFruitType =
      randomFruitType();

    let nextFruitType =
      randomFruitType();


    // ========================================
    // Matter.js
    // ========================================

    const engine =
      Engine.create();


    engine.gravity.y =
      1;


    const render =
      Render.create({

        element:
          gameContainer,

        engine:
          engine,

        options: {

          width:
            gameWidth,

          height:
            gameHeight,

          wireframes:
            false,

          background:
            "transparent"

        }

      });


    Render.run(render);


    const runner =
      Runner.create();


    Runner.run(
      runner,
      engine
    );


    // ========================================
    // 壁
    // ========================================

    function createWalls() {

      const thickness = 40;


      const floor =
        Bodies.rectangle(

          gameWidth / 2,
          gameHeight + 20,
          gameWidth,
          thickness,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const leftWall =
        Bodies.rectangle(

          -20,
          gameHeight / 2,
          thickness,
          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      const rightWall =
        Bodies.rectangle(

          gameWidth + 20,
          gameHeight / 2,
          thickness,
          gameHeight,

          {
            isStatic: true,

            render: {
              visible: false
            }
          }

        );


      Composite.add(

        engine.world,

        [
          floor,
          leftWall,
          rightWall
        ]

      );

    }


    createWalls();


    // ========================================
    // ゲーム開始
    // ========================================

    function prepareGameStart() {

      if (gameStarted) {
        return true;
      }


      const name =
        playerNameInput.value.trim();


      if (name === "") {

        message.textContent =
          "名前を入力してください！";


        playerNameInput.focus();


        return false;

      }


      currentPlayerName =
        name;


      gameStarted =
        true;


      playerNameInput.disabled =
        true;


      message.textContent =
        "ゲームスタート！";


      return true;

    }


    // ========================================
    // スコア
    // ========================================

    function addScore(type) {

      score +=
        fruits[type].score;


      scoreDisplay.textContent =
        "SCORE：" + score;

    }


    // ========================================
    // 物理フルーツ
    // ========================================

    function createPhysicsFruit(
      x,
      y,
      type
    ) {

      const data =
        fruits[type];


      const body =
        Bodies.circle(

          x,
          y,
          data.radius,

          {

            restitution:
              0.1,

            friction:
              0.35,

            frictionStatic:
              0.5,

            density:
              0.001,

            render: {

              visible:
                true,

              fillStyle:
                data.color,

              strokeStyle:
                "#555555",

              lineWidth:
                2

            }

          }

        );


      body.fruitType =
        type;


      body.merging =
        false;


      body.dangerStart =
        null;


      // ========================================
      // 絵文字
      // ========================================

      const element =
        document.createElement(
          "div"
        );


      element.classList.add(
        "physics-fruit"
      );


      element.textContent =
        data.emoji;


      const diameter =
        data.radius * 2;


      element.style.width =
        diameter + "px";


      element.style.height =
        diameter + "px";


      element.style.fontSize =
        (
          diameter * 0.8
        ) + "px";


      /*
        left/topを毎フレーム変えるのではなく、
        transformだけで動かします。
      */

      element.style.left = "0px";
      element.style.top = "0px";


      gameContainer.appendChild(
        element
      );


      body.fruitElement =
        element;


      Composite.add(
        engine.world,
        body
      );


      // 作成直後から同じ位置に表示

      syncFruitElement(
        body
      );


      return body;

    }


    // ========================================
    // 1個のフルーツを同期
    // ========================================

    function syncFruitElement(body) {

      if (
        body.fruitType === undefined ||
        !body.fruitElement
      ) {

        return;

      }


      const data =
        fruits[body.fruitType];


      const x =
        body.position.x -
        data.radius;


      const y =
        body.position.y -
        data.radius;


      body.fruitElement.style.transform =
        "translate3d(" +
        x +
        "px," +
        y +
        "px,0) rotate(" +
        body.angle +
        "rad)";

    }


    // ========================================
    // Matter.jsの描画直前に同期
    //
    // Canvasの丸とHTML絵文字の更新を
    // 同じ描画タイミングに近づける
    // ========================================

    Events.on(

      render,

      "beforeRender",

      function() {

        const bodies =
          Composite.allBodies(
            engine.world
          );


        bodies.forEach(
          function(body) {

            syncFruitElement(
              body
            );

          }
        );

      }

    );


    // ========================================
    // NEXT
    // ========================================

    function updateNextDisplay() {

      const data =
        fruits[nextFruitType];


      nextFruit.textContent =
        data.emoji;


      nextFruit.style.backgroundColor =
        data.color;

    }


    // ========================================
    // 現在のフルーツ
    // ========================================

    function updateCurrentFruit() {

      const data =
        fruits[currentFruitType];


      const diameter =
        data.radius * 2;


      /*
        次のフルーツが大きくても
        壁からはみ出さないように補正
      */

      if (
        fruitX < data.radius
      ) {

        fruitX =
          data.radius;

      }


      if (
        fruitX >
        gameWidth - data.radius
      ) {

        fruitX =
          gameWidth -
          data.radius;

      }


      currentFruit.textContent =
        data.emoji;


      currentFruit.style.width =
        diameter + "px";


      currentFruit.style.height =
        diameter + "px";


      currentFruit.style.fontSize =
        (
          diameter * 0.8
        ) + "px";


      currentFruit.style.left =
        (
          fruitX -
          data.radius
        ) + "px";


      currentFruit.style.top =
        "10px";


      guide.style.left =
        fruitX + "px";

    }


    updateCurrentFruit();
    updateNextDisplay();


    // ========================================
    // 左右移動
    // ========================================

    let moveDirection = 0;


    let lastMoveTime =
      performance.now();


    const moveSpeed = 180;


    function movementLoop(
      currentTime
    ) {

      const delta =
        (
          currentTime -
          lastMoveTime
        ) / 1000;


      lastMoveTime =
        currentTime;


      if (
        canDrop &&
        !gameOver &&
        moveDirection !== 0
      ) {

        fruitX +=
          moveDirection *
          moveSpeed *
          delta;


        updateCurrentFruit();

      }


      requestAnimationFrame(
        movementLoop
      );

    }


    requestAnimationFrame(
      movementLoop
    );


    function startMove(
      direction
    ) {

      if (
        gameOver ||
        !canDrop
      ) {

        return;

      }


      moveDirection =
        direction;

    }


    function stopMove() {

      moveDirection = 0;

    }


    // ========================================
    // 落とす
    // ========================================

    function dropFruit() {

      if (
        !canDrop ||
        gameOver
      ) {

        return;

      }


      if (
        !prepareGameStart()
      ) {

        return;

      }


      canDrop = false;


      moveDirection = 0;


      dropButton.disabled =
        true;


      currentFruit.style.display =
        "none";


      const data =
        fruits[currentFruitType];


      createPhysicsFruit(

        fruitX,

        20 + data.radius,

        currentFruitType

      );


      setTimeout(

        function() {

          if (gameOver) {
            return;
          }


          // ====================================
          // NEXTを現在のフルーツへ
          // ====================================

          currentFruitType =
            nextFruitType;


          nextFruitType =
            randomFruitType();


          /*
            ここではfruitXを中央に戻しません。

            つまり前回落とした位置から
            次のフルーツを操作できます。
          */


          canDrop = true;


          dropButton.disabled =
            false;


          currentFruit.style.display =
            "flex";


          updateCurrentFruit();


          updateNextDisplay();

        },

        500

      );

    }


    // ========================================
    // 合体
    // ========================================

    Events.on(

      engine,

      "collisionStart",

      function(event) {

        if (gameOver) {
          return;
        }


        event.pairs.forEach(

          function(pair) {

            const bodyA =
              pair.bodyA;


            const bodyB =
              pair.bodyB;


            if (
              bodyA.fruitType === undefined ||
              bodyB.fruitType === undefined
            ) {

              return;

            }


            if (
              bodyA.fruitType !==
              bodyB.fruitType
            ) {

              return;

            }


            // 🥥は最終

            if (
              bodyA.fruitType >=
              fruits.length - 1
            ) {

              return;

            }


            if (
              bodyA.merging ||
              bodyB.merging
            ) {

              return;

            }


            bodyA.merging = true;
            bodyB.merging = true;


            const newType =
              bodyA.fruitType + 1;


            const newX =
              (
                bodyA.position.x +
                bodyB.position.x
              ) / 2;


            const newY =
              (
                bodyA.position.y +
                bodyB.position.y
              ) / 2;


            // スコア

            addScore(
              newType
            );


            // HTML削除

            if (
              bodyA.fruitElement
            ) {

              bodyA.fruitElement.remove();

            }


            if (
              bodyB.fruitElement
            ) {

              bodyB.fruitElement.remove();

            }


            // Body削除

            Composite.remove(
              engine.world,
              bodyA
            );


            Composite.remove(
              engine.world,
              bodyB
            );


            // 新しいフルーツ

            createPhysicsFruit(

              newX,
              newY,
              newType

            );

          }

        );

      }

    );


    // ========================================
    // GAME OVER判定
    // ========================================

    function checkGameOver() {

      if (
        gameOver ||
        !gameStarted
      ) {

        gameOverCountdown.style.display =
          "none";

        return;

      }


      const bodies =
        Composite.allBodies(
          engine.world
        );


      const now =
        performance.now();


      /*
        複数のフルーツが危険な場合は
        一番残り時間が短いものを表示
      */

      let shortestRemaining =
        null;


      for (
        const body of bodies
      ) {

        if (
          body.fruitType === undefined
        ) {

          continue;

        }


        const radius =
          fruits[
            body.fruitType
          ].radius;


        const fruitTop =
          body.position.y -
          radius;


        /*
          落下しているだけでカウントを
          開始しないようにする
        */

        const almostStopped =
          Math.abs(
            body.velocity.y
          ) < 0.5;


        if (
          fruitTop <
          dangerLineY &&
          almostStopped
        ) {

          if (
            body.dangerStart ===
            null
          ) {

            body.dangerStart =
              now;

          }


          const elapsed =
            now -
            body.dangerStart;


          const remaining =
            Math.max(
              0,
              gameOverTime -
              elapsed
            );


          if (
            shortestRemaining === null ||
            remaining <
            shortestRemaining
          ) {

            shortestRemaining =
              remaining;

          }


          // 0秒

          if (
            elapsed >=
            gameOverTime
          ) {

            endGame();

            return;

          }

        } else {

          /*
            ラインより下へ戻ったら
            そのフルーツのカウントをリセット
          */

          body.dangerStart =
            null;

        }

      }


      // ========================================
      // カウントダウン表示
      // ========================================

      if (
        shortestRemaining !==
        null
      ) {

        const seconds =
          (
            shortestRemaining /
            1000
          ).toFixed(1);


        gameOverCountdown.textContent =
          "GAME OVERまで " +
          seconds +
          "秒";


        gameOverCountdown.style.display =
          "block";

      } else {

        gameOverCountdown.style.display =
          "none";

      }

    }


    /*
      0.1秒ごとではなく
      約0.05秒ごとに更新して
      カウントを滑らかにする
    */

    setInterval(
      checkGameOver,
      50
    );


    // ========================================
    // GAME OVER
    // ========================================

    async function endGame() {

      if (gameOver) {
        return;
      }


      gameOver = true;


      canDrop = false;


      moveDirection = 0;


      dropButton.disabled =
        true;


      leftButton.disabled =
        true;


      rightButton.disabled =
        true;


      currentFruit.style.display =
        "none";


      guide.style.display =
        "none";


      gameOverCountdown.style.display =
        "none";


      finalScore.textContent =
        "SCORE：" + score;


      gameOverScreen.style.display =
        "flex";


      await saveScore();

    }


    // ========================================
    // Supabase保存
    // ========================================

    async function saveScore() {

      if (scoreSaved) {
        return;
      }


      scoreSaved = true;


      saveMessage.textContent =
        "スコア保存中...";


      const {
        error
      } =
        await supabaseClient

          .from("game03_scores")

          .insert({

            player_name:
              currentPlayerName,

            score:
              score

          });


      if (error) {

        console.error(
          error
        );


        saveMessage.textContent =
          "スコアの保存に失敗しました";


        return;

      }


      saveMessage.textContent =
        "スコアを保存しました！";


      await loadRanking();

    }


    // ========================================
    // ランキング
    // ========================================

    async function loadRanking() {

      rankingList.innerHTML =
        "<li>ランキング読み込み中...</li>";


      const {
        data,
        error
      } =
        await supabaseClient

          .from("game03_scores")

          .select(
            "player_name, score"
          )

          .order(
            "score",
            {
              ascending: false
            }
          )

          .limit(10);


      if (error) {

        console.error(
          error
        );


        rankingList.innerHTML =
          "<li>ランキングを読み込めませんでした</li>";


        return;

      }


      rankingList.innerHTML = "";


      if (
        !data ||
        data.length === 0
      ) {

        rankingList.innerHTML =
          "<li>まだスコアがありません</li>";


        return;

      }


      data.forEach(

        function(record, index) {

          const li =
            document.createElement(
              "li"
            );


          li.classList.add(
            "ranking-row"
          );


          if (index === 0) {

            li.classList.add(
              "rank1"
            );

          } else if (
            index === 1
          ) {

            li.classList.add(
              "rank2"
            );

          } else if (
            index === 2
          ) {

            li.classList.add(
              "rank3"
            );

          }


          // 順位

          const position =
            document.createElement(
              "span"
            );


          position.classList.add(
            "ranking-position"
          );


          if (index === 0) {

            position.textContent =
              "🥇 1";

          } else if (
            index === 1
          ) {

            position.textContent =
              "🥈 2";

          } else if (
            index === 2
          ) {

            position.textContent =
              "🥉 3";

          } else {

            position.textContent =
              (index + 1) +
              "位";

          }


          // 名前

          const name =
            document.createElement(
              "span"
            );


          name.classList.add(
            "ranking-name"
          );


          name.textContent =
            record.player_name;


          // スコア

          const scoreElement =
            document.createElement(
              "span"
            );


          scoreElement.classList.add(
            "ranking-score"
          );


          scoreElement.textContent =
            record.score +
            "点";


          li.appendChild(
            position
          );


          li.appendChild(
            name
          );


          li.appendChild(
            scoreElement
          );


          rankingList.appendChild(
            li
          );

        }

      );

    }


    // ========================================
    // もう一度遊ぶ
    // ========================================

    restartButton.addEventListener(

      "click",

      function() {

        location.reload();

      }

    );


    // ========================================
    // ボタン操作
    // ========================================

    leftButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(-1);

      }

    );


    rightButton.addEventListener(

      "pointerdown",

      function(event) {

        event.preventDefault();

        startMove(1);

      }

    );


    window.addEventListener(
      "pointerup",
      stopMove
    );


    window.addEventListener(
      "pointercancel",
      stopMove
    );


    dropButton.addEventListener(
      "click",
      dropFruit
    );


    // ========================================
    // キーボード
    // ========================================

    document.addEventListener(

      "keydown",

      function(event) {

        if (
          event.key ===
          "ArrowLeft"
        ) {

          event.preventDefault();

          startMove(-1);

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          event.preventDefault();

          startMove(1);

        }


        if (
          (
            event.key ===
            "ArrowDown" ||
            event.key === " "
          ) &&
          !event.repeat
        ) {

          event.preventDefault();

          dropFruit();

        }

      }

    );


    document.addEventListener(

      "keyup",

      function(event) {

        if (
          event.key ===
          "ArrowLeft" ||
          event.key ===
          "ArrowRight"
        ) {

          stopMove();

        }

      }

    );


    window.addEventListener(
      "blur",
      stopMove
    );


    // ========================================
    // ランキング読み込み
    // ========================================

    loadRanking();

  </script>

</body>

</html>
